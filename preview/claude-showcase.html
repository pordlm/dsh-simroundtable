<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>小 Claude · 动作展示台</title>
<style>
  :root { --bg:#171a20; --panel:#20242d; --line:#2f3644; --ink:#dfe4ee; --dim:#8b94a7; --acc:#d98a5a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:13px/1.55 system-ui,"Segoe UI",sans-serif;
         display:flex; gap:0; height:100vh; overflow:hidden; }
  #stageWrap { position:relative; width:min(52vw,760px); flex:none;
               background:radial-gradient(circle at 50% 30%,#2b3040,#14161b 72%); }
  #cv { display:block; width:100%; height:100%; }
  #tag { position:absolute; left:14px; bottom:12px; color:var(--dim); font-size:12px; letter-spacing:.03em; }
  #panel { flex:1; padding:16px 20px 20px; overflow:auto; background:var(--panel); border-left:1px solid var(--line); }
  h1 { font-size:16px; margin:0 0 2px; }
  .sub { color:var(--dim); margin-bottom:16px; }
  h2 { font-size:12px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em;
       margin:18px 0 8px; font-weight:600; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:6px; }
  button { background:#2a303c; color:var(--ink); border:1px solid var(--line); border-radius:7px;
           padding:7px 8px; cursor:pointer; font:inherit; transition:background .12s,border-color .12s; }
  button:hover { background:#333b4a; }
  button:active { background:#3c4658; }
  button.on { background:#4a3a2c; border-color:var(--acc); color:#ffd9bd; }
  .row { display:grid; grid-template-columns:118px 1fr 44px; gap:8px; align-items:center; margin:5px 0; }
  .row label { color:var(--dim); font-size:12px; }
  input[type=range] { width:100%; accent-color:var(--acc); }
  .val { text-align:right; color:#a8b4c8; font-variant-numeric:tabular-nums; font-size:12px; }
  #err { color:#ff9d9d; white-space:pre-wrap; font-family:ui-monospace,Consolas,monospace; font-size:11px; margin-top:12px; }
  .hint { color:#6f7889; font-size:12px; margin-top:14px; }
</style>
</head>
<body>
<div id="stageWrap"><canvas id="cv"></canvas><div id="tag">小 Claude · PSD→PSD2Live→moc3</div></div>
<div id="panel">
  <h1>小 Claude · 动作展示台</h1>
  <div class="sub">点按钮看动作；滑杆直接写参数。抱书姿势走第二个 moc3 + 交叉淡化。</div>

  <h2>动作</h2>
  <div class="grid" id="gGrid"></div>

  <h2>循环</h2>
  <div class="grid" style="grid-template-columns:repeat(2,1fr)">
    <button id="btnBlink">眨眼一次</button>
    <button id="btnSpeak">说话</button>
    <button id="btnTour">自动巡演</button>
    <button id="btnBook">抱书姿势</button>
    <button id="btnZoom">特写</button>
  </div>

  <h2>参数</h2>
  <div id="sliders"></div>

  <div class="hint">键盘：1–9 触发前九个动作，空格眨眼，T 说话，B 切抱书，Z 特写。</div>
  <pre id="err"></pre>
</div>

<script src="../assets/vendor/live2dcubismcore.min.js"></script>
<script src="../assets/vendor/pixi.min.js"></script>
<script src="../assets/vendor/cubism4.min.js"></script>
<script>
/* 舞台侧的驱动逻辑照搬 preview/longtable.html：待机用固定种子的慢正弦，
   动作用 env = sin(πu) 的包络，参数每帧整份写回，所以永远不会残留。 */
const q = new URLSearchParams(location.search);
const MODEL_MAIN = q.get('model') || '../assets/build/claude-v3/model/claude.layout.model3.json';
const MODEL_BOOK = q.get('bookmodel') || '../assets/build/claude-book-model/claude-book.layout.model3.json';
const NO_EYE = q.has('noeye');
const NO_IDLE = q.has('noidle');

const GESTURES = [
  { id:'nod',      label:'点头',   dur:1100, f:u => { const e = Math.sin(Math.PI*u); return { nod:-11*e }; } },
  { id:'bow',      label:'鞠躬',   dur:1500, f:u => { const e = Math.sin(Math.PI*u); return { nod:-16*e, lean:2*e }; } },
  // 摇头：三个来回 / 1.15 s（≈2.6 Hz）、±6°。原来的 ±8° 四个来回（4.4 Hz）在 6% 座位比例下
  // 一帧就能让侧发横跨脸部 30+ px，看起来像两层错位；同时给 ParamHairFront 一个滞后四分之一
  // 周期的量，头发像被甩出去再跟回来，而不是硬跟着头一起转。
  { id:'shake',    label:'摇头',   dur:1150, f:u => { const e = Math.sin(Math.PI*u), s = Math.sin(Math.PI*3*u), c = Math.cos(Math.PI*3*u); return { turn:6*s*e, hair:-0.16*c*e }; } },
  { id:'tilt',     label:'歪头',   dur:1400, f:u => { const e = Math.sin(Math.PI*u); return { tilt:9*e }; } },
  { id:'look',     label:'远望',   dur:1700, f:u => { const e = Math.sin(Math.PI*u); return { turn:13*e, tilt:3*e }; } },
  { id:'glance',   label:'瞥一眼', dur:1300, f:u => { const e = Math.sin(Math.PI*u); return { turn:-9*e, tilt:-3*e }; } },
  { id:'think',    label:'思考',   dur:1900, f:u => { const e = Math.sin(Math.PI*u); return { tilt:6*e, nod:-3*e, hair:0.25*e }; } },
  { id:'smile',    label:'微笑',   dur:2100, f:u => { const e = Math.sin(Math.PI*u); return { mform:0.6*e, eye:1-0.35*e }; } },
  { id:'happy',    label:'开心',   dur:1600, f:u => { const e = Math.sin(Math.PI*u); return { happy:e, nod:4*e, hair:0.2*e }; } },
  { id:'huh',      label:'疑惑',   dur:1300, f:u => { const e = Math.sin(Math.PI*u); return { tilt:-7*e, brow:0.6*e }; } },
  { id:'leanin',   label:'凑近',   dur:1600, f:u => { const e = Math.sin(Math.PI*u); return { lean:6*e, nod:-4*e }; } },
  { id:'hairtoss', label:'甩发',   dur:1200, f:u => { const e = Math.sin(Math.PI*u); return { hair:0.6*e, turn:4*e }; } },
];

const sliders = [
  ['AngleX',      -30, 30, 0],
  ['AngleY',      -30, 30, 0],
  ['AngleZ',      -30, 30, 0],
  ['BodyAngleZ',  -10, 10, 0],
  ['BodyAngleY',  -10, 10, 0],
  ['EyeBallX',     -1,  1, 0],
  ['EyeBallY',     -1,  1, 0],
  ['MouthOpenY',    0,  1, 0],
  ['Breath',        0,  1, 0.5],
];
const state = {};
const sBox = document.getElementById('sliders');
for (const [k, lo, hi, def] of sliders) {
  state[k] = def;
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = `<label>${k}</label><input type="range" min="${lo}" max="${hi}" step="${(hi-lo)/200}" value="${def}"><span class="val">${def}</span>`;
  const inp = row.querySelector('input'), val = row.querySelector('.val');
  inp.oninput = () => { state[k] = +inp.value; val.textContent = (+inp.value).toFixed(2); };
  sBox.appendChild(row);
}

/* ?p=AngleX:12,MouthOpenY:1 —— 与 probe.html 同语法，便于无头截图定格 */
if (q.get('p')) for (const kv of q.get('p').split(',')) {
  const [k, v] = kv.split(':');
  if (k in state) state[k] = +v;
}

const errBox = document.getElementById('err');
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const env = u => Math.sin(Math.PI * clamp(u, 0, 1));

let model = null, alt = null, altReady = false, showBook = false, tourOn = false;
let fx = null, tourIdx = -1, tourNext = 0;
let blinkStart = -1e9, blinkDur = 150;
let speakOn = q.has('speak');          // ?speak=1 直接进说话态
let syMean = 0.5;                      // sy 的慢均值，用来找「低于平时」的换气口
const T_PIN = q.has('tpin') ? Number(q.get('tpin')) : null;   // ?tpin=<ms> 钉住时间，便于无头定格

// 固定种子的待机相位，同一个 URL 每次打开动作一致，便于对比截图
let seed = (q.has('seed') ? Number(q.get('seed')) | 0 : 20261103) >>> 0;
function rnd() {
  seed = (seed + 0x6D2B79F5) >>> 0;
  let t = seed;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const W = { bobPeriod:3700, bobAmp:2.4, swayPeriod:6100, swayAmp:2.0,
            turnPeriod:8300, turnAmp:3.2, phase:rnd()*Math.PI*2 };

function speechEnv(t) {
  const sp = t / 1000 + W.phase;
  return Math.abs(Math.sin(sp * 5.5) * 0.72 + Math.sin(sp * 8.9) * 0.28);
}
function blinkAt(t) { blinkStart = t; blinkDur = 150; }
function blinkValue(t, sy) {
  const u = (t - blinkStart) / blinkDur;
  if (u >= 0 && u < 1) return u < 0.3 ? 1 - u / 0.3 : (u - 0.3) / 0.7;
  if (speakOn) {
    // 说话中不按随机时钟眨眼：只在「声音轻下来」的换气口眨，间隔至少 2.2 s。
    // syMean 是 sy 的慢均值，用相对值而不是固定阈值——两条正弦几乎不同时过零，
    // 固定阈值（sy<0.22）等一整段话都等不到。
    syMean = syMean * 0.94 + sy * 0.06;
    const breath = 0.5 + 0.5 * Math.sin(t / 1000 * 0.55 + W.phase);
    if (breath > 0.55 && sy < 0.5 && sy < syMean * 0.8 && t - blinkStart > 2200) blinkAt(t);
    return 1;
  }
  if (t - blinkStart > 2400 + rnd() * 5600) blinkAt(t);
  return 1;
}

function trigger(id) {
  const g = GESTURES.find(x => x.id === id);
  if (!g) return;
  fx = { g, start: performance.now() };
  for (const b of document.querySelectorAll('#gGrid button')) b.classList.toggle('on', b.dataset.id === id);
}

async function boot() {
  // 这个 pixi 版本的 BaseTexture.defaultOptions 可能不存在（gpt-model.html 也做了同样的判断），
  // 直接写会抛 "Cannot set properties of undefined"，整个 boot() 挂掉、画面全空。
  if (PIXI.BaseTexture && PIXI.BaseTexture.defaultOptions) {
    PIXI.BaseTexture.defaultOptions.mipmap = PIXI.MIPMAP_MODES.ON;
  }
  const app = new PIXI.Application({ view: document.getElementById('cv'),
    resizeTo: document.getElementById('stageWrap'),
    backgroundAlpha: 0, antialias: true,
    resolution: Math.min(2, window.devicePixelRatio || 1), autoDensity: true });

  model = await PIXI.live2d.Live2DModel.from(MODEL_MAIN, { autoInteract:false, autoUpdate:true });
  app.stage.addChild(model);
  if (NO_EYE) model.internalModel.eyeBlink = null;
  // model.width/height 会随 scale 变化，必须先把 scale=1 时的尺寸存下来，
  // 否则 resize 回调里再用 model.width 算 scale 会自我放大（第一版就这么炸成 3 倍）。
  const BASE_W = model.width, BASE_H = model.height;
  // ?zoom=1 / 「特写」按钮：座位尺度下面部只有 ~20px，嘴的形变深度只有 3~4px，
  // 想看清眼白/瞳孔/口型就必须放大。放大时把 anchor 挪到脸的高度（包围盒约 28% 处），
  // 让脸停在舞台中央，而不是像整体缩放那样把脑袋顶出画面。
  let zoomOn = q.has('zoom');
  const fit = () => {
    const W0 = app.renderer.width, H0 = app.renderer.height;
    const base = Math.min(W0 * 0.92 / BASE_W, H0 * 0.94 / BASE_H);
    const s = base * (zoomOn ? 2.6 : 1);
    const ay = zoomOn ? 0.26 : 1;
    const py = zoomOn ? H0 * 0.5 : H0 * 0.985;
    model.scale.set(s);
    model.anchor.set(0.5, ay);
    model.position.set(W0 / 2, py);
    if (alt) { alt.scale.set(s); alt.anchor.set(0.5, ay); alt.position.copyFrom(model.position); }
  };
  fit();
  window.addEventListener('resize', fit);

  async function ensureAlt() {
    if (altReady) return alt;
    altReady = true;
    try {
      alt = await PIXI.live2d.Live2DModel.from(MODEL_BOOK, { autoInteract:false, autoUpdate:true });
      alt.alpha = 0; alt.visible = false;
      app.stage.addChild(alt);
      if (NO_EYE) alt.internalModel.eyeBlink = null;
      fit();
    } catch (e) { errBox.textContent = '抱书模型加载失败: ' + (e && e.message || e); }
    return alt;
  }

  const setp = m => (id, v) => { try { m.internalModel.coreModel.setParameterValueById(id, v); } catch (e) {} };

  app.ticker.add(() => {
    // tpin 优先：?noidle=1 只是「不跟着真实时钟跑」，不能让 tpin 失效
    // （第一版写成 NO_IDLE ? 0 : (tpin...)，于是 ?noidle=1&tpin=1400 实际还是 t=0，
    //  两帧截图只差 348px，差点被当成「说话态没驱动」）。
    const t = (T_PIN !== null && Number.isFinite(T_PIN)) ? T_PIN : (NO_IDLE ? 0 : performance.now());
    if (fx && t - fx.start >= fx.g.dur) { fx = null; for (const b of document.querySelectorAll('#gGrid button')) b.classList.remove('on'); }

    // u 必须是 0..1 的归一化相位：这里原来传的是「已经过去的毫秒数」，于是每条曲线
    // 都在毫秒尺度上振荡（sin(π*ms) 的周期只有 2 ms）—— 点一下按钮就鬼畜抖动。
    // lib/client.js 与 longtable.html 一直是对的，只有这页漏了 /dur。
    const off = fx ? fx.g.f((t - fx.start) / fx.g.dur) : {};
    const env = speakOn ? speechEnv(t) : 0;              // 语音包络：口型与点头共用
    const sy = speakOn ? 0.10 + 0.90 * env : state.MouthOpenY;
    const talkNod = speakOn ? 5.2 * (env - 0.5) : 0;     // (env-0.5) 才有回位
    const talkLean = speakOn ? 1.1 * (env - 0.5) : 0;
    const breathe = 0.5 + 0.5 * Math.sin(t / 1000 * 1.1 + W.phase);
    const eye = blinkValue(t, env);
    // 状态行每帧刷新，无头 dump-dom 就能读到当前 sy / 眨眼值，不必截图像素猜
    errBox.dataset.sy = env.toFixed(3);
    errBox.dataset.eye = eye.toFixed(3);
    errBox.dataset.mouth = sy.toFixed(3);

    const pose = {
      AngleX: state.AngleX + (W.turnAmp * Math.sin(t / W.turnPeriod + W.phase)) + (off.turn || 0),
      AngleY: state.AngleY + 1.2 * Math.sin(t / (W.bobPeriod * 1.3) + W.phase) + (off.nod || 0) + talkNod,
      AngleZ: state.AngleZ + (off.tilt || 0) + 0.8 * Math.sin(t / (W.swayPeriod * 0.7) + W.phase),
      BodyAngleX: 0,
      BodyAngleY: (off.lean || 0) + talkLean + state.BodyAngleY,
      BodyAngleZ: state.BodyAngleZ + 0.6 * Math.sin(t / W.swayPeriod + W.phase),
      BodyLean: (off.lean || 0) + talkLean,
      HairFront: clamp(0.085 * Math.sin(t / 1500 + 1.7) + 0.035 * Math.sin(t / 620 + 2.3) + (off.hair || 0), -1, 1),
      Breath: state.Breath === 0.5 ? breathe : state.Breath,
      EyeLOpen: NO_EYE ? 1 : Math.min(eye, off.eye === undefined ? 1 : off.eye),
      EyeROpen: NO_EYE ? 1 : Math.min(eye, off.eye === undefined ? 1 : off.eye),
      EyeBallX: clamp(state.EyeBallX + (W.turnAmp * 0.05) * Math.sin(t / W.turnPeriod + W.phase), -1, 1),
      EyeBallY: state.EyeBallY,
      MouthOpenY: clamp(sy, 0, 1),
      MouthForm: clamp(-0.15 + (off.mform || 0), -1, 1),
      BrowLY: off.brow || 0,
      BrowRY: off.brow || 0,
      EyeBallForm: off.happy || 0,
    };

    const sp = setp(model);
    for (const k in pose) sp('Param' + k, pose[k]);
    if (alt && alt.visible) { const sa = setp(alt); for (const k in pose) sa('Param' + k, pose[k]); }

    if (tourOn && t > tourNext) {
      tourIdx = (tourIdx + 1) % GESTURES.length;
      trigger(GESTURES[tourIdx].id);
      tourNext = t + GESTURES[tourIdx].dur + 700;
    }
  });

  // 按钮
  const gGrid = document.getElementById('gGrid');
  for (const g of GESTURES) {
    const b = document.createElement('button');
    b.textContent = g.label; b.dataset.id = g.id;
    b.onclick = () => { tourOn = false; document.getElementById('btnTour').classList.remove('on'); trigger(g.id); };
    gGrid.appendChild(b);
  }
  document.getElementById('btnBlink').onclick = () => blinkAt(performance.now());
  const btnZoom = document.getElementById('btnZoom');
  if (btnZoom) {
    btnZoom.classList.toggle('on', zoomOn);
    btnZoom.onclick = () => { zoomOn = !zoomOn; btnZoom.classList.toggle('on', zoomOn); fit(); };
  }
  const btnSpeak = document.getElementById('btnSpeak');
  if (btnSpeak) {
    btnSpeak.classList.toggle('on', speakOn);
    btnSpeak.onclick = () => { speakOn = !speakOn; btnSpeak.classList.toggle('on', speakOn); };
  }
  document.getElementById('btnTour').onclick = e => {
    tourOn = !tourOn; e.target.classList.toggle('on', tourOn);
    if (tourOn) { tourIdx = -1; tourNext = 0; } else { fx = null; }
  };
  document.getElementById('btnBook').onclick = async e => {
    showBook = !showBook;
    e.target.classList.toggle('on', showBook);
    if (showBook) {
      const m = await ensureAlt();
      if (!m) { showBook = false; e.target.classList.remove('on'); return; }
      m.visible = true; m.alpha = 1; model.alpha = 0;
    } else {
      if (alt) { alt.visible = false; alt.alpha = 0; }
      model.alpha = 1;
    }
  };
  addEventListener('keydown', ev => {
    if (ev.key === ' ') { ev.preventDefault(); blinkAt(performance.now()); }
    if (ev.key === 'b' || ev.key === 'B') document.getElementById('btnBook').click();
    if (ev.key === 't' || ev.key === 'T') document.getElementById('btnSpeak')?.click();
    if (ev.key === 'z' || ev.key === 'Z') document.getElementById('btnZoom')?.click();
    const n = Number(ev.key);
    if (n >= 1 && n <= 9) trigger(GESTURES[n - 1].id);
  });

  errBox.textContent = 'ok · 参数 ' + (model.internalModel.coreModel.getParameterCount?.() ?? '?') +
    ' 个 · 贴图 ' + Math.round(model.width) + 'x' + Math.round(model.height);
  // ?book=1 直接进抱书姿势；?gest=nod:0.5 可定格某个动作，都是给无头截图用的
  if (q.has('book')) document.getElementById('btnBook').click();
  if (q.has('gest')) { const [id, u] = q.get('gest').split(':'); trigger(id); fx.start = performance.now() - (Number(u) || 0.5) * fx.g.dur; }
}
boot().catch(e => { errBox.textContent = 'load failed: ' + (e && e.stack || e); });
</script>
</body>
</html>
