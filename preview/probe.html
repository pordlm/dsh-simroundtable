<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>probe</title>
<style>
  html,body{margin:0;padding:0;background:#00ff00;overflow:hidden}
  canvas{display:block}
</style>
<script src="../assets/vendor/live2dcubismcore.min.js"></script>
<script src="../assets/vendor/pixi.min.js"></script>
<script src="../assets/vendor/cubism4.min.js"></script>
</head>
<body>
<canvas id="cv"></canvas>
<script type="module">
// Minimal deterministic probe: load one model, pin a set of parameters, render
// exactly one frame, then stop.  No ticker, no UI, no blinking -- so a headless
// --screenshot cannot race the animation or hang on an endless rAF loop.
//
//   ?model=<path>            model3.json (default: the Claude build)
//   ?p=EyeLOpen:0,AngleX:20  parameters to pin before the single render
//   ?expr=Smile              apply one expression from the model3.json first
//   ?scale=1                 canvas scale (1 = 2048 canvas pixels)
const q = new URLSearchParams(location.search);
const MODEL = q.get('model') || '../assets/build/claude-parts/p2l/claude.model3.json';
const SCALE = Number(q.get('scale') || 1);
// ?bg=%23101014 replaces the chroma-key page colour.  Keep the default green for
// cut-out inspection, but audit renders on a dark page: semi-transparent parts
// (hair tips, ribbon edges) blend with the backdrop, and against #00ff00 they read
// as green leakage that does not exist on the actual stage.
const BG = q.get('bg');
if (BG) document.documentElement.style.background = document.body.style.background = BG;
const CW = 2048, CH = 2048;
const W = Math.round(CW * SCALE), H = Math.round(CH * SCALE);

const app = new PIXI.Application({
  view: document.getElementById('cv'),
  width: W, height: H,
  backgroundAlpha: 0,
  antialias: true,
  autoStart: false,
});
document.getElementById('cv').style.width = W + 'px';
document.getElementById('cv').style.height = H + 'px';

// ?mip=1: pre-register the atlas pages as mipmapped base textures BEFORE the
// model is created, so the loader reuses them from the PIXI cache.  Setting the
// flag afterwards does nothing (the page is already uploaded, and this build
// keeps its textures behind renderer._textures where we cannot reach them).
// A 4096 atlas squeezed into ~170 px needs 24x minification; without mipmaps
// the GPU point-samples it, and where the sample lands on an alpha=0 texel the
// hair simply vanishes for that pixel - on a dark stage that reads as black
// speckles inside the hair.
if (q.get('mip') === '1') {
  try {
    const res = await fetch(MODEL);
    const desc = await res.json();
    const base = new URL(MODEL, location.href);
    for (const t of (desc.FileReferences && desc.FileReferences.Textures) || []) {
      const url = new URL(t, base).href;
      PIXI.BaseTexture.from(url, {
        mipmap: PIXI.MIPMAP_MODES.ON,
        scaleMode: PIXI.SCALE_MODES.LINEAR,
        anisotropy: 4,
      });
    }
  } catch (e) {
    console.warn('mip setup failed', e);
  }
}
const model = await PIXI.live2d.Live2DModel.from(MODEL, { autoInteract: false, autoUpdate: false });
app.stage.addChild(model);
model.anchor.set(0, 0);
model.scale.set(SCALE);
// A model drawn much smaller than its atlas (a 4096 page squeezed into ~170 CSS
// px on the stage) is minified ~12x. Without mipmaps the GPU point-samples that
// downscale, so every sub-pixel move re-picks different texels and the whole
// figure shimmers. `?mip=1` turns mipmapping on so the two renders can be
// compared edge-pixel by edge-pixel.
if (q.get('mip') === '1') {
  for (const tex of model.internalModel.textures || []) {
    try {
      tex.baseTexture.mipmap = PIXI.MIPMAP_MODES.ON;
      tex.baseTexture.scaleMode = PIXI.SCALE_MODES.LINEAR;
      tex.baseTexture.update();
    } catch (e) { /* readonly on some builds */ }
  }
}
const b = model.getLocalBounds();
model.position.set(-b.x * SCALE + Number(q.get('dx') || 0), -b.y * SCALE + Number(q.get('dy') || 0));

const pins = (q.get('p') || '').split(',').map(s => s.trim()).filter(Boolean);
const cm = model.internalModel.coreModel;
// Kill the automatic blink: it rewrites ParamEyeLOpen/ParamEyeROpen on every
// update, so a pinned eye value would be undone before the single render.
model.internalModel.eyeBlink = undefined;
const applied = [];
// Optional expression: it has to be applied *before* the single update, otherwise
// the additive/multiply pass runs after our pinned values and wipes them.
const expr = q.get('expr');
if (expr) {
  try { model.expression(expr); applied.push('expr=' + expr); } catch (e) { applied.push('expr!' + expr); }
}
for (const pin of pins) {
  const i = pin.indexOf(':');
  if (i < 0) continue;
  const id = pin.slice(0, i).trim();
  const v = Number(pin.slice(i + 1));
  if (!id || Number.isNaN(v)) continue;
  cm.setParameterValueById(id.startsWith('Param') ? id : 'Param' + id, v);
  applied.push(id + '=' + v);
}
// ?part=PartExtra:0 pins a *part* opacity (hides a whole layer group). Part opacity
// is an input the core multiplies into every drawable of that part, so it survives
// the single update below.
for (const pin of (q.get('part') || '').split(',').map(s => s.trim()).filter(Boolean)) {
  const i = pin.indexOf(':');
  if (i < 0) continue;
  const id = pin.slice(0, i).trim();
  const v = Number(pin.slice(i + 1));
  if (!id || Number.isNaN(v)) continue;
  try { cm.setPartOpacityById(id, v); applied.push('part ' + id + '=' + v); }
  catch (e) { applied.push('part!' + id); }
}
model.update(16.6);
app.renderer.render(app.stage);
// Debug handle: page.screenshot() composites the page background, so any
// alpha-aware measurement (edge halos, holes) has to come from the renderer's
// own buffer instead. Extract keeps the model's alpha intact.
window.__app = app;
window.__model = model;

const meta = document.createElement('div');
meta.id = 'meta';
meta.style.cssText = 'position:fixed;left:0;top:0;font:12px monospace;color:#000;background:#fff;padding:2px 4px';
meta.textContent = 'READY ' + (applied.join(' ') || 'noparam') + ' size=' + W + 'x' + H;
document.body.appendChild(meta);
document.title = 'READY';
</script>
</body>
</html>
