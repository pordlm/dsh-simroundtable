<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>GPT 龙娘 · 模型预检</title>
<style>
  body { margin:0; background:#1b1d22; color:#dfe4ee; font:13px/1.5 system-ui,"Segoe UI",sans-serif; display:flex; }
  #stage { width:760px; height:900px; background:radial-gradient(circle at 50% 35%,#2b3040,#14161b 70%); }
  #panel { flex:1; padding:16px 20px; overflow:auto; }
  h1 { font-size:15px; margin:0 0 4px; letter-spacing:.02em; }
  .sub { color:#8d96a8; margin-bottom:14px; }
  .row { display:grid; grid-template-columns:130px 1fr 46px; gap:8px; align-items:center; margin:6px 0; }
  input[type=range] { width:100%; }
  .val { text-align:right; color:#9fb0cc; font-variant-numeric:tabular-nums; }
  button { background:#2c3242; color:#dfe4ee; border:1px solid #394155; border-radius:6px; padding:5px 10px; margin:2px 4px 2px 0; cursor:pointer; }
  button:hover { background:#39415a; }
  #err { color:#ff9d9d; white-space:pre-wrap; font-family:ui-monospace,Consolas,monospace; font-size:12px; }
  .hint { color:#78829a; font-size:12px; margin-top:12px; }
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>
<div id="panel">
  <h1>GPT 龙娘 · 参数预检</h1>
  <div class="sub">拖动滑杆看几何是否真的跟着动；不动 = 该参数没绑到网格。</div>
  <div id="sliders"></div>
  <div style="margin-top:14px">
    <button data-motion="Blink">眨眼 Blink</button>
    <button data-motion="Nod">点头 Nod</button>
    <button data-motion="Shake">摇头 Shake</button>
    <button id="idle">待机 Idle: 开</button>
    <button id="reset">复位</button>
  </div>
  <div class="hint">滑杆全部复位后就是模型静止姿势；眼睛不动说明 ParamEyeLOpen/ROpen 没绑。</div>
  <pre id="err"></pre>
</div>
<script src="../assets/vendor/live2dcubismcore.min.js"></script>
<script src="../assets/vendor/pixi.min.js"></script>
<script src="../assets/vendor/cubism4.min.js"></script>
<script>
const PARAMS = [
  ['ParamAngleX', -30, 30, 0], ['ParamAngleY', -30, 30, 0], ['ParamAngleZ', -30, 30, 0],
  ['ParamBodyAngleZ', -10, 10, 0], ['ParamBodyAngleX', -10, 10, 0],
  ['ParamEyeLOpen', 0, 1, 1], ['ParamEyeROpen', 0, 1, 1],
  ['ParamEyeBallX', -1, 1, 0], ['ParamEyeBallY', -1, 1, 0],
  ['ParamMouthOpenY', 0, 1, 0], ['ParamMouthForm', -1, 1, 0],
  ['ParamBrowLY', -1, 1, 0], ['ParamBrowRY', -1, 1, 0],
  ['ParamBreath', 0, 1, 0],
];
const state = {};
const box = document.getElementById('sliders');
for (const [id, min, max, def] of PARAMS) {
  state[id] = def;
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = `<label>${id.replace('Param','')}</label>` +
    `<input type="range" min="${min}" max="${max}" step="${(max-min)/200}" value="${def}">` +
    `<span class="val">${def}</span>`;
  const [input, val] = [row.querySelector('input'), row.querySelector('.val')];
  input.oninput = () => { state[id] = +input.value; val.textContent = (+input.value).toFixed(2); };
  box.appendChild(row);
}

(async () => {
  try {
    // ?p=EyeLOpen:0,MouthOpenY:1  —— 便于无头截图验证参数绑定
    const q = new URLSearchParams(location.search).get('p');
    if (q) for (const kv of q.split(',')) {
      const [k, v] = kv.split(':');
      const key = 'Param' + k;
      if (key in state) state[key] = +v;
    }
    for (const el of document.querySelectorAll('.row')) {
      const key = 'Param' + el.querySelector('label').textContent;
      el.querySelector('input').value = state[key];
      el.querySelector('.val').textContent = (+state[key]).toFixed(2);
    }
    // ?z=3 —— 放大画布，否则眼睛只有 ~41px，无头截图根本判不了细节
    const Z = Math.max(1, +(new URLSearchParams(location.search).get('z') || 1));
    // ?raw=1 —— 1:1 像素、画布左上对齐：截图坐标 == 模型坐标，逐像素比图才不会
    // 因 anchor/缩放换算错位（之前?s 换算曾把两个不同裁切率的图当成"渲染偏大"）
    const RAW = new URLSearchParams(location.search).has('raw');
    // ?raw=1 顺带把底刷成纯绿：截图里"非绿"就是模型墨迹，可以直接算 bbox 对齐源图
    if (RAW) {
      document.body.style.background = '#00ff00';
      document.getElementById('stage').style.background = '#00ff00';
    }
    // 2048 atlases are drawn at ~0.1 scale on the stage; without mipmaps a
// 1px outline aliases into a stair-stepped halo ("edges look rough").
if (PIXI.BaseTexture && PIXI.BaseTexture.defaultOptions) {
  PIXI.BaseTexture.defaultOptions.mipmap = PIXI.MIPMAP_MODES.ON;
}
const app = new PIXI.Application({ view: document.getElementById('cv'),
      width: RAW ? 2048 : 760 * Z, height: RAW ? 2048 : 900 * Z,
      backgroundAlpha: 0, antialias: true });
    // ?model=../assets/build/gpt-p2l-soft/p2l/gpt.model3.json —— 换一版模型对比用
    const MODEL = new URLSearchParams(location.search).get('model')
      || '../assets/build/gpt-p2l/p2l/gpt.model3.json';
    const model = await PIXI.live2d.Live2DModel.from(MODEL,
      { autoInteract: false, autoUpdate: true });
    app.stage.addChild(model);
    if (RAW) {
      model.anchor.set(0, 0);
      model.scale.set(1);
      const b = model.getLocalBounds();          // 把 bounds 左上角顶到 (0,0)，让
      model.position.set(-b.x, -b.y);            // 截图像素 == 模型坐标，可直接逐像素比
    } else {
      // 注意：model.width/height 是**贴图内容的紧包围盒**（≈1877×2001），不是 moc3
      // 画布 2048×2048；拿它算缩放会把模型放大 ~9% 并左右裁掉，所以固定用画布尺寸。
      const CW = 2048, CH = 2048;
      const s = Math.min(700 / CW, 860 / CH) * Z;
      model.scale.set(s);
      model.anchor.set(0.5, 1);
      model.position.set(380 * Z, 880 * Z);
    }

    // ?probe=1 —— 把模型实际画布尺寸与落屏 scale 打进 DOM，便于无头 --dump-dom 取证
    if (new URLSearchParams(location.search).has('probe')) {
      const d = document.createElement('div');
      d.id = 'probe';
      d.textContent = 'MW=' + model.width + ' MH=' + model.height + ' S=' + s + ' Z=' + Z;
      document.body.appendChild(d);
    }

    // ?noeye=1 关掉自动眨眼：否则模型自带的 EyeBlink 每帧把 ParamEyeLOpen 写回 1，
    // 无头截图里 ?p=EyeLOpen:0 就永远看不到闭眼
    const noEye = new URLSearchParams(location.search).has('noeye');
    if (noEye) model.internalModel.eyeBlink = null;

    let idleOn = true;
    app.ticker.add(() => {
      const cm = model.internalModel.coreModel;
      if (q) model.internalModel.motionManager.stopAllMotions();
      for (const [id] of PARAMS) cm.setParameterValueById(id, state[id]);
      // 关掉 EyeBlink 后没有东西再写 EyeLOpen，参数会停在 moc3 的默认值上——而
      // 眼皮开合的关键形在该默认值下会把上睫毛压薄，截图就看着像"半睁"。这里补回
      // 睁眼值，也就是 Pixi 的 EyeBlink 平时在做的事。
      if (noEye) {
        cm.setParameterValueById('ParamEyeLOpen', 1);
        cm.setParameterValueById('ParamEyeROpen', 1);
      }
    });
    document.querySelectorAll('[data-motion]').forEach(b => b.onclick = () =>
      model.motion(b.dataset.motion));
    document.getElementById('idle').onclick = e => {
      idleOn = !idleOn;
      e.target.textContent = '待机 Idle: ' + (idleOn ? '开' : '关');
      if (idleOn) model.motion('Idle'); else model.internalModel.motionManager.stopAllMotions();
    };
    document.getElementById('reset').onclick = () => {
      for (const [id, , , def] of PARAMS) state[id] = def;
      box.querySelectorAll('.row').forEach((row, i) => {
        const [inp, val] = [row.querySelector('input'), row.querySelector('.val')];
        inp.value = PARAMS[i][3]; val.textContent = PARAMS[i][3];
      });
    };
    document.getElementById('err').textContent =
      'ok · 参数 ' + (model.internalModel.coreModel.getParameterCount?.() ?? '?') +
      ' 个 · 尺寸 ' + Math.round(model.width) + 'x' + Math.round(model.height);
  } catch (e) {
    document.getElementById('err').textContent = 'load failed: ' + (e && e.stack || e);
  }
})();
</script>
</body>
</html>
