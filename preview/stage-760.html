<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>stage 760 harness (adaptive height)</title>
<style>
  html,body{margin:0;background:#0b0f18;color:#e8eef8;font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif}
  #host{position:relative;width:760px;overflow:hidden;background:#0a0d14;display:flex;justify-content:center}
  #inner{position:relative;flex:0 0 auto;width:760px;transform-origin:50% 0;
    background:radial-gradient(120% 90% at 50% 0%,#1a2333 0%,#121826 45%,#0a0d14 100%);overflow:hidden}
  .plate{position:absolute;transform:translate(-50%,0);padding:2px 8px;border-radius:999px;
    background:rgba(10,15,24,.74);border:1px solid rgba(140,170,220,.28);color:#cfe0ff;font-size:10.5px;
    line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:7;
    display:flex;align-items:center;gap:4px}
  .plate .dot{width:6px;height:6px;border-radius:50%;flex:0 0 auto}
  .bubble{position:absolute;transform:translate(-50%,-100%);padding:7px 9px;border-radius:12px;
    background:linear-gradient(180deg,rgba(247,250,255,.97),rgba(227,236,250,.97));color:#182233;
    font-size:11.5px;line-height:1.5;box-shadow:0 10px 24px rgba(0,0,0,.45);z-index:8;pointer-events:none}
  .bubble .who{font-size:9.5px;letter-spacing:.05em;color:#5b6f92;margin-bottom:2px}
  .bubble .body{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
  .bubble:after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;width:12px;height:12px;
    background:rgba(232,239,251,.97);transform:rotate(45deg);border-radius:2px}
</style>
</head>
<body>
<div id="host"><div id="inner">
  <div id="canvasLayer" style="position:absolute;left:0;top:0;width:760px;pointer-events:none"></div>
</div></div>
<script src="../assets/vendor/live2dcubismcore.min.js"></script>
<script src="../assets/vendor/pixi.min.js"></script>
<script src="../assets/vendor/cubism4.min.js"></script>
<script>
const W=760,ASPECT=.85,MARGIN=22;
const H_MAX=440,H_MIN=280,TOP_PAD_RATIO=.66,TOP_PAD_MIN=122,PLATE_GAP=39,TABLE_RATIO=.88;
const HUES=["#4da3ff","#7d6bff","#ff9d4d","#3ddc97","#ff6b8a","#5ad2e6","#c084fc","#f5c542"];
const PHONE_PARTS=["Part106","Part6","Part107"];
const PHONE_PARAMS=["phone","phone2","phone3","phone4","phone5","phone6","phone7","phone8"];
// Mirrors STAGE_CHARACTERS in lib/client.js so this harness composes exactly
// what the plugin composes. A rig is optional: missing files fall back to the
// whale-girl, same as the plugin's load path.
const WHALE={key:"whale-girl",url:"../assets/models/whale-girl/c_0120.model3.json",scale:1,dx:0,dy:0,mouth:false};
// Read at module scope: frame() is module level too, and a flag declared inside
// boot() would throw there (ReferenceError mid-frame instead of a silent no-op).
const LOOK_OFF=new URLSearchParams(location.search).get('nolook')==='1';
const RIGS={
  claude:{url:"../assets/build/claude-v3/model/claude.layout.model3.json",scale:1.70,dx:0,dy:120,mouth:true,cut:true,
    book:"../assets/build/claude-book-model/claude-book.layout.model3.json"},
  gpt:{url:"../assets/build/gpt-half-atlas2048/gpt.model3.json",scale:.85,dx:111,dy:-25,mouth:true},
  gemini:{url:"../assets/build/gemini-v1/gemini.layout.model3.json",scale:1.70,dx:0,dy:120,mouth:true,cut:true},
  // Grok sits like Claude/Gemini but her art carries a shorter, lower head: at
  // 1.70 her eye line landed 24 px below Claude's and her face read a size down.
  // 1.80 evens the head up (eye span matches Claude's after the scale) and the
  // 107 dy lifts the eye line back onto the neighbours' (see `axe` note in
  // lib/client.js: same numbers, expressed at this file's raw-dy convention).
  // `axe` is the part that holds the battle axe: hidden unless the axe gesture
  // says otherwise, so a meeting does not start with a halberd on the table.
  grok:{url:"../assets/build/grok-v1/grok.layout.model3.json",scale:1.80,dx:0,dy:107,mouth:true,cut:true,axe:"PartExtra"}
};
function characterFor(name){
  const key=String(name||"").toLowerCase();
  for(const id of Object.keys(RIGS))if(key.includes(id))return{key:id,...RIGS[id]};
  return WHALE;
}
const NAMES={2:["Grok","Claude"],3:["DeepSeek-V3.2","Qwen3-Max","Kimi-K2"],
  5:["DeepSeek-V3.2","Qwen3-Max","GLM-4.6","Kimi-K2","Doubao"],
  8:["DeepSeek-V3.2","Qwen3-Max","GLM-4.6","Kimi-K2","Claude","GPT","Gemini","Doubao"]};

function layout(count){
  const usable=W-MARGIN*2, step=usable/count;
  const gapChair=Math.round(Math.max(4,Math.min(26,step*.13)));
  const gapChar=Math.round(Math.max(2,Math.min(14,step*.06)));
  const overlap=count>=6?.24:count>=5?.12:0;
  const widthBudget=step-gapChar+step*overlap, heightCap=200-count*6;
  const charH=Math.round(Math.max(96,Math.min(widthBudget/ASPECT,heightCap)));
  const topPad=Math.max(Math.round(charH*TOP_PAD_RATIO),TOP_PAD_MIN);
  const baseY=topPad+charH, tableTop=baseY-PLATE_GAP, tableH=Math.round(charH*TABLE_RATIO);
  const stageH=Math.round(Math.max(H_MIN,Math.min(H_MAX,tableTop+tableH)));
  const xs=[];for(let i=0;i<count;i++)xs.push(MARGIN+step*(i+.5));
  const chairW=Math.round(Math.min((charH*1.15*2)/3,step-gapChair));
  return {count,step,xs,charH,chairW,chairH:Math.round(chairW*1.5),topPad,baseY,tableTop,tableH,stageH,
    wideBubble:count>=6,bubbleLines:count>=6?4:5};
}
function makeRnd(seed){let s=seed>>>0;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;
  t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);
  return((t^t>>>14)>>>0)/4294967296;};}
let RND=Math.random;
function wobble(){return{bobPeriod:3000+RND()*2200,bobAmp:1.1+RND()*1.3,swayPeriod:4200+RND()*3200,
  swayAmp:.7+RND()*1.1,turnPeriod:5200+RND()*4800,turnAmp:2.2+RND()*4,phase:RND()*Math.PI*2,
  gest:null,next:2500+RND()*5500};}
// Idle acting: short one-shot offsets layered on the wobble, same shape as the
// preview stage's GESTURES (envelope sin(pi*u) so they start and end at zero).
// Only turn/nod/lean, because those are the three parameters a whale-girl rig
// and a member rig both expose.
const GESTURES=[
  {id:"nod",dur:1100,f:u=>({nod:-11*Math.sin(Math.PI*u)})},
  {id:"tilt",dur:1400,f:u=>({turn:7*Math.sin(Math.PI*u),nod:2*Math.sin(Math.PI*u)})},
  {id:"think",dur:1900,f:u=>({turn:5*Math.sin(Math.PI*u),nod:-3*Math.sin(Math.PI*u)})},
  {id:"lean",dur:1600,f:u=>({lean:6*Math.sin(Math.PI*u)})},
  {id:"shake",dur:900,f:u=>({turn:8*Math.sin(Math.PI*u*4)*Math.sin(Math.PI*u)})}
];
// A rig can carry a prop in its own part (Grok's battle axe is PartExtra). The
// prop is part of the *acting*, not of the costume: it fades in for the beat of
// this gesture and is gone again, so a seated meeting never shows it by default.
// `axe` is a 0..1 part-opacity channel the frame loop applies to the rig.
const AXE_GESTURE={id:"axe",dur:3000,f:u=>{
  const env=Math.sin(Math.PI*u);
  const rise=Math.min(1,u/.12),fall=Math.min(1,(1-u)/.22);
  return{nod:2.4*env,lean:3*env,axe:Math.max(0,Math.min(rise,fall))};
}};
function gestureOffset(w,t){
  const force=w.forced;
  if(force){const g=GESTURES.concat(AXE_GESTURE).find(x=>x.id===force.id);return g?g.f(force.u):{};}
  const pool=w.axe?GESTURES.concat(AXE_GESTURE):GESTURES;
  if(!w.gest||t-w.gest.start>w.gest.dur){w.gest=null;if(t>=w.next){
    const g=pool[Math.floor(RND()*pool.length)];
    w.gest={g,start:t,dur:g.dur};w.next=t+g.dur+7000+RND()*9000;}}
  if(!w.gest)return{};
  return w.gest.g.f((t-w.gest.start)/w.gest.dur);
}
function frame(models,wobbles,t,active,baseY){
  for(let i=0;i<models.length;i++){const m=models[i];if(!m)continue;const w=wobbles[i];const sp=i===active;
    const c=m.__char||WHALE, seatY=baseY+(c.dy||0);
    let nod,lean,turn,breath,mouthVal=0,bookReady=0,axeVal=0;
    // Book variant: a seat that keeps listening quietly long enough swaps to the
    // rig holding a codex, and swaps back the moment it speaks. Same canvas and
    // same scale, so only the transform and the pose parameters need copying.
    const bk=m.__book;
    if(bk){if(sp)bk.idleSince=null;else if(bk.idleSince==null)bk.idleSince=t;
      // A pinned clock never advances, so ?book=1 pins the variant instead of
      // waiting out the idle timer.
      const idle=bk.force?1e6:(bk.idleSince==null?0:t-bk.idleSince);
      if(idle>9000&&!bk.started){bk.started=true;if(m.__loadBook)m.__loadBook();}
      bk.blend+=((idle>9000&&bk.model?1:0)-bk.blend)*.06;
      bookReady=Math.max(0,Math.min(1,(bk.blend-.35)/.3));}
    if(sp){const s=t/1000;
      // Same syllable envelope as the mouth, so the head nods on the beat the
      // lips move instead of on an unrelated slow sine.
      const sy=c.mouth?Math.abs(Math.sin(s*5.5)*.72+Math.sin(s*8.9)*.28):0;
      nod=2.6*Math.sin(s*3.1)+5.2*(sy-.5);lean=3.2*Math.sin(s*1.55)+1.1*(sy-.5);
      turn=1.5*Math.sin(s*1.1);breath=.5+.5*Math.sin(s*1.7);m.y=seatY-3;m.rotation=0;
      mouthVal=c.mouth?(sy>.32?1:0):0;
    }
    else{nod=1.4*Math.sin(t/w.bobPeriod+w.phase*.7);lean=w.swayAmp*Math.sin(t/w.swayPeriod+w.phase);
      turn=w.turnAmp*Math.sin(t/w.turnPeriod+w.phase*1.7);breath=.5+.5*Math.sin(t/w.bobPeriod+w.phase);
      const off=gestureOffset(w,t);
      turn+=off.turn||0;nod+=off.nod||0;lean+=off.lean||0;
      // Prop channel: 0 by default, so a rig whose part holds a prop (the axe)
      // keeps it out of the scene until its own gesture brings it in.
      axeVal=off.axe||0;
      // Turn toward whoever is speaking. The target is a direction, not an angle:
      // /240 is 0.32 of the 760px stage, so the seat furthest away gets the full
      // 6 degrees. Smoothing is per-frame instead of time-based so a pinned clock
      // (?tpin) still settles on the same pose.
      let lookTarget=0;
      if(!LOOK_OFF&&active>=0&&active!==i&&models[active])
        lookTarget=Math.max(-1,Math.min(1,(models[active].x-m.x)/240));
      w.look=(w.look||0)*0.93+lookTarget*0.07;
      turn+=w.look*6;
      m.y=seatY+Math.sin(t/w.bobPeriod+w.phase)*w.bobAmp;m.rotation=Math.sin(t/(w.swayPeriod*.8)+w.phase)*.003;}
    // 前发靠手摆：rig 的 PhysicsHairFront 被关掉了（整块网格同时含刘海与侧发，
    // 软阈值会把刘海拖到眼上），所以这里补两个不同周期的正弦。
    const hairSway=.085*Math.sin(t/1500+i*1.7)+.035*Math.sin(t/620+i*2.3);
    const applyPose=(tgt)=>{try{const core=tgt.internalModel.coreModel;
      core.setParameterValueById('ParamAngleX',turn);core.setParameterValueById('ParamAngleY',nod);
      core.setParameterValueById('ParamBodyAngleZ',lean);
      try{core.setParameterValueById('ParamMouthOpenY',mouthVal)}catch(e){}
      for(const id of PHONE_PARAMS){try{core.setParameterValueById(id,0)}catch(e){}}
      // 前发是刚性跟头（物理关掉），参数只给 ±0.22：再大侧发就会甩离头皮，
      // 露出发际线后面的洞（深色舞台上读作黑斑；见 longtable 的 applyPoseParams）。
      try{core.setParameterValueById('ParamHairFront',Math.max(-.22,Math.min(.22,hairSway)))}catch(e){}
      try{core.setParameterValueById('ParamBreath',breath)}catch(e){}
      // Part opacity is an input to the core update, so it has to be written
      // before core.update() below; the renderer then reads it for this frame.
      if(tgt.__axePart){try{core.setPartOpacityById(tgt.__axePart,axeVal)}catch(e){}}
      core.update();}catch(e){}};
    if(m.__fade==null)m.__fade=0;
    if(m.__fade<1)m.__fade=Math.min(1,m.__fade+.08);
    applyPose(m);
    m.alpha=m.__fade*(1-bookReady);
    if(bk&&bk.model){bk.model.position.set(m.x,m.y);
      bk.model.scale.copyFrom(m.scale);bk.model.rotation=m.rotation;
      bk.model.alpha=bookReady;bk.model.visible=bookReady>.002;applyPose(bk.model);}
  }
}
function dropPhone(m){
  try{m.internalModel.motionManager.stopAllMotions()}catch(e){}
  try{const core=m.internalModel.coreModel;
    for(const id of PHONE_PARTS){try{core.setPartOpacityById(id,0)}catch(e){}}
    for(const id of PHONE_PARAMS){try{core.setParameterValueById(id,0)}catch(e){}}
    core.update();}catch(e){}
}
(async()=>{
  const q=new URLSearchParams(location.search);
  const count=Math.max(2,Math.min(8,Number(q.get('n')||3)));
  const active=Number(q.has('active')?q.get('active'):0);
  const topic=q.get('topic')||'如果模型可以投票，谁最适合做这个项目的技术负责人？';
  const text=q.get('text')||'我倾向先定义清楚「技术负责人」的产出，再谈人选：接口层稳定、评审意见能落地、出事敢背锅，这三条比模型名气重要得多。';
  // Seeded randomness so two renders with the same ?tpin can be compared: without
  // this the wobble phases alone swamp any pose difference.
  RND=makeRnd(Number(q.get('seed')||20261103)|0);
  const noGest=q.get('nogest')==='1';
  const forceGest=(()=>{const raw=q.get('gest');if(!raw)return null;
    const [id,u]=raw.split(':');return{id,u:Math.max(0,Math.min(1,Number(u)||0.5))};})();
  const L=layout(count), xs=L.xs, charH=L.charH, H=L.stageH, baseY=L.baseY;
  const inner=document.getElementById('inner');
  const host=document.getElementById('host');
  host.style.height=H+'px';inner.style.height=H+'px';
  document.getElementById('canvasLayer').style.height=H+'px';
  const names=(()=>{const raw=q.get('names');
    if(raw)return raw.split(',').map(s=>s.trim()).filter(Boolean).slice(0,count);
    return NAMES[count]||NAMES[8];})();

  const chairLayer=document.createElement('div');
  chairLayer.style.cssText=`position:absolute;left:0;top:0;width:760px;height:${H}px;pointer-events:none`;
  inner.insertBefore(chairLayer, document.getElementById('canvasLayer'));
  xs.forEach((x,i)=>{
    const img=document.createElement('img');
    img.src='../assets/chairs/chair-long-back.png';
    img.style.cssText=`position:absolute;left:${Math.round(x-L.chairW/2)}px;top:${baseY-Math.round(L.chairH*.78)}px;`
      +`width:${L.chairW}px;opacity:.92;filter:brightness(.58) saturate(.75);pointer-events:none`;
    chairLayer.appendChild(img);
  });

  const app=new PIXI.Application({width:W,height:H,backgroundAlpha:0,antialias:true,
    resolution:Math.min(2,window.devicePixelRatio||1),autoDensity:true});
  app.view.style.display='block';app.view.style.width=W+'px';app.view.style.height=H+'px';
  document.getElementById('canvasLayer').appendChild(app.view);

  const table=document.createElement('div');
  table.style.cssText=`position:absolute;left:0;top:${L.tableTop}px;width:${W}px;height:${L.tableH}px;`
    +`background:url("../assets/table-long.png") center/100% 100% no-repeat;`
    +`filter:drop-shadow(0 14px 18px rgba(0,0,0,.5));pointer-events:none`;
  inner.appendChild(table);

  const tt=document.createElement('div');
  tt.style.cssText=`position:absolute;left:220px;top:${L.tableTop+Math.round(L.tableH*.41)}px;width:320px;text-align:center;`
    +`color:#f3ead8;text-shadow:0 2px 10px rgba(0,0,0,.65);pointer-events:none`;
  tt.innerHTML=`<div style="font-size:9px;letter-spacing:.32em;color:#c9a86a;font-weight:600;margin-bottom:3px">TOPIC</div>`
    +`<div style="font-size:12.5px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${topic}</div>`;
  inner.appendChild(tt);

  const bubbleW=L.wideBubble?Math.round(Math.max(184,Math.min(236,L.step*2.2)))
    :Math.round(Math.min(206,Math.max(150,L.step*1.5)));
  xs.forEach((x,i)=>{
    const p=document.createElement('div');
    p.className='plate';
    p.style.left=x+'px';p.style.top=(baseY-35)+'px';p.style.maxWidth=Math.round(L.step-12)+'px';p.style.boxSizing='border-box';
    if(i===active)p.style.borderColor=HUES[i%8],p.style.color='#fff';
    const narrow=L.step<130;
    if(narrow)p.style.fontSize='9px',p.style.padding='2px 6px';
    const plateLabel=narrow?String(names[i]).split('·')[0].trim():names[i];
    const dot=narrow?'':`<span class="dot" style="background:${HUES[i%8]}"></span>`;
    p.innerHTML=dot+`<span style="overflow:hidden;text-overflow:ellipsis">${plateLabel}</span>`;
    inner.appendChild(p);

    if(i===active){
      const left=Math.max(bubbleW/2+6,Math.min(W-bubbleW/2-6,x));
      const b=document.createElement('div');
      b.className='bubble';
      b.style.left=Math.round(left)+'px';b.style.top=Math.max(4,L.topPad-22)+'px';b.style.width=bubbleW+'px';
      if(L.wideBubble)b.style.fontSize='10.5px',b.style.lineHeight='1.45';
      b.innerHTML=`<div class="who">${names[i]}</div>`
        +`<div class="body" style="-webkit-line-clamp:${L.bubbleLines}">${text}</div>`;
      inner.appendChild(b);
    }
  });

  const models=[],wobbles=xs.map(()=>{const w=wobble();
    if(forceGest)w.forced=forceGest;
    if(noGest)w.next=Number.POSITIVE_INFINITY;
    return w;});
  // Start the clock before the rigs finish arriving (same reason as
  // lib/client.js): a member rig is a few MB of texture and a headless render
  // that waits for all of them just stays blank. frame() skips missing seats.
  const t0=performance.now();
  // ?tpin=<ms> freezes the frame clock so two renders differ only by pose;
  // without it the only time source is performance.now(), which a headless
  // screenshot cannot advance.
  const tPin=q.has('tpin')?Number(q.get('tpin')):null;
  const tick=()=>frame(models,wobbles,tPin!==null&&Number.isFinite(tPin)?tPin:performance.now()-t0,active,baseY);
  tick();app.ticker.add(tick);
  await Promise.all(xs.map(async(x,i)=>{
    const c=characterFor(names[i]);
    // autoUpdate:false —— 框架自带的 update 挂在 PIXI.Ticker.shared 上，和我们的
    // frame()（挂在 app.ticker 上）各跑一遍：它每帧写呼吸/眨眼/姿势，把 frame() 刚
    // 写好的参数又盖回去，两次写入的相位又不一定落在同一帧，于是整座模型在两套
    // 姿势之间来回跳（观感就是「整个人小幅抖动 / 有重影」）。
    // 实测：?tpin=6000 冻结时钟后连拍 4 张，autoUpdate:true 时相邻两帧差 1800–9200
    // 个像素；把它关掉后 4 张逐字节相同（0 px）。
    let m=null;
    try{m=await PIXI.live2d.Live2DModel.from(c.url,{autoInteract:false,autoUpdate:false});}
    catch(e){
      if(c.key!==WHALE.key){try{m=await PIXI.live2d.Live2DModel.from(WHALE.url,{autoInteract:false,autoUpdate:false});}catch(e2){m=null}}
      if(!m)return;
      m.__char=WHALE;
    }
    if(!m.__char)m.__char=c;
    // Props live in their own part on some rigs (Grok's axe is PartExtra); the
    // frame loop writes 0 into it every frame unless the axe gesture is running.
    m.__axePart=c.axe||null;
    if(c.axe)wobbles[i].axe=true;
    m.scale.set((charH*c.scale)/m.height);m.anchor.set(.5,1)
    // dx 是画布像素量（脸相对画布中线的偏移），要乘缩放并反号才是舞台位移；
    // 直接相加会把整座模型甩到隔壁座位上去（longtable 用的是 -faceDx*k）
    const faceDx=c.dx?-c.dx*m.scale.x:0;
    m.position.set(x+faceDx,baseY+(c.dy||0));m.zIndex=i;
    app.stage.addChild(m);dropPhone(m);models[i]=m;
    // Full-body rigs stand behind a table that only occludes from the table edge
    // down, and their legs would otherwise hang under the table top. Clip at the
    // seat baseline so only the upper body shows, like the half-body rigs.
    if(c.cut){
      const clip=new PIXI.Graphics();clip.beginFill(0x000000);
      clip.drawRect(-4000,-4000,8000,4000+baseY);clip.endFill();
      app.stage.addChild(clip);m.mask=clip;
    }
    if(c.book){
      const bk={url:c.book,model:null,blend:0,started:false,idleSince:null};
      m.__book=bk;
      if(q.get('book')==='1')bk.force=true;
      m.__loadBook=async()=>{try{
        const alt=await PIXI.live2d.Live2DModel.from(bk.url,{autoInteract:false,autoUpdate:false});
        alt.anchor.set(.5,1);alt.zIndex=i;alt.alpha=0;alt.visible=false;
        if(c.cut){const clip2=new PIXI.Graphics();clip2.beginFill(0x000000);
          clip2.drawRect(-4000,-4000,8000,4000+baseY);clip2.endFill();
          app.stage.addChild(clip2);alt.mask=clip2;}
        dropPhone(alt);app.stage.addChild(alt);bk.model=alt;}catch(e){}};
    }
  }));

  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const plateRects=[...inner.querySelectorAll('.plate')].map(p=>{const r=p.getBoundingClientRect();
      return [Math.round(r.left),Math.round(r.right),Math.round(r.width)];});
    const bubble=inner.querySelector('.bubble');
    const br=bubble?bubble.getBoundingClientRect():null;
    document.body.dataset.debug=JSON.stringify({count,active,step:Math.round(L.step),charH,chairW:L.chairW,chairH:L.chairH,
      stageH:H,topPad:L.topPad,baseY,tableTop:L.tableTop,tableH:L.tableH,bubbleW,
      bubbleRect:br?[Math.round(br.top),Math.round(br.bottom),Math.round(br.left),Math.round(br.right)]:null,
      plates:plateRects,xs:xs.map(Math.round)});
    window.__ready=true;
  }));
  // Debug handles: a page.screenshot can catch the compositor mid-swap and hand
  // back a black or torn rectangle, while renderer.extract reads the WebGL back
  // buffer directly. Same escape hatch as preview/longtable.html.
  window.__app=app;window.__models=models;window.__wobbles=wobbles;
})().catch(e=>{document.body.dataset.error=e.message;console.error(e)});
</script>
