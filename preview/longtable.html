<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>圆桌会议 · 长桌原型</title>
<style>
  html,body{margin:0;height:100%;background:#0b0f18;color:#e8eef8;font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif;overflow:hidden}
  #fit{position:absolute;left:50%;top:50%;transform-origin:50% 50%}
  #stage{position:relative;width:1400px;height:920px;transform-origin:0 0;
    background:radial-gradient(120% 90% at 50% 0%,#1a2333 0%,#121826 45%,#0a0d14 100%);overflow:hidden}
  #stage:before{content:"";position:absolute;inset:0;background:
    radial-gradient(60% 40% at 50% 20%,rgba(120,170,255,.10),transparent 70%);pointer-events:none}
  .head{position:absolute;left:0;right:0;top:20px;text-align:center;z-index:30}
  .head h1{margin:0;font-size:19px;font-weight:600;letter-spacing:.08em;color:#dbe7ff}
  .head p{margin:5px 0 0;font-size:12.5px;color:#8fa3c4;max-width:860px;margin-inline:auto;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #chairs,#plates,#bubbles{position:absolute;inset:0}
  #chairs{z-index:1}
  #seats{z-index:2;position:absolute;left:0;top:0}
  #table{z-index:3;position:absolute;left:0;top:585px;width:1400px;height:350px;
    background:url("../assets/table-long.png") center/100% 100% no-repeat;filter:drop-shadow(0 22px 26px rgba(0,0,0,.5))}
  #tabletext{z-index:6;position:absolute;left:440px;top:700px;width:520px;text-align:center;
    font-size:14.5px;line-height:1.6;color:#f3ead8;text-shadow:0 2px 10px rgba(0,0,0,.65)}
  #tabletext b{display:block;font-size:11px;letter-spacing:.32em;color:#c9a86a;margin-bottom:5px;font-weight:600}
  #plates{z-index:7;pointer-events:none}
  .plate{position:absolute;transform:translate(-50%,0);padding:2px 9px;border-radius:999px;
    background:rgba(10,15,24,.74);border:1px solid rgba(140,170,220,.28);color:#cfe0ff;font-size:11.5px;
    white-space:nowrap;backdrop-filter:blur(3px)}
  .plate .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
  #bubbles{z-index:8;pointer-events:none}
  .bubble{position:absolute;transform:translate(-50%,-100%);width:210px;padding:8px 11px;border-radius:13px;
    background:linear-gradient(180deg,rgba(247,250,255,.97),rgba(227,236,250,.97));color:#182233;
    font-size:12px;line-height:1.5;box-shadow:0 10px 24px rgba(0,0,0,.45);
    opacity:0;transition:opacity .16s ease}
  .bubble.show{opacity:1}
  .bubble:after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;width:14px;height:14px;
    background:rgba(232,239,251,.97);transform:rotate(45deg);border-radius:3px}
  .bubble .who{display:block;font-size:10px;letter-spacing:.05em;color:#5b6f92;margin-bottom:2px}
  #hud{position:absolute;right:16px;top:16px;z-index:20;font-size:11px;color:#7e93b5;text-align:right}
  #hud b{color:#b8cdf0}
  #foot{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:11px;color:#5f7290;z-index:20}
</style>
</head>
<body>
<div id="fit"><div id="stage">
  <div class="head">
    <h1>圆桌会议 · 长桌模式</h1>
    <p id="topic">议题：如果模型可以投票，谁最适合做这个项目的技术负责人？</p>
  </div>
  <div id="chairs"></div>
  <canvas id="seats" width="1400" height="920"></canvas>
  <div id="table"></div>
  <div id="tabletext"><b>TOPIC</b><span id="tableTopic">技术负责人怎么选？</span></div>
  <div id="plates"></div>
  <div id="bubbles"></div>
  <div id="hud"><b id="fps">--</b> fps<br><span id="status">加载模型…</span></div>
  <div id="foot">长桌原型 · 全部正面朝屏 · Live2D 鲸鱼娘（CC BY-NC-SA 4.0）</div>
</div></div>

<script src="../assets/vendor/live2dcubismcore.min.js"></script>
<script src="../assets/vendor/pixi.min.js"></script>
<script src="../assets/vendor/cubism4.min.js"></script>
<script>
const STAGE_W = 1400, STAGE_H = 920;
const TABLE_TOP = 600;
const BASE_Y = 668;               // 脚底基线，桌沿以下的部分被桌面遮住
const NAMES = ["DeepSeek", "Qwen", "GLM", "Kimi", "Claude", "GPT", "Gemini", "Doubao"];
const HUES  = ["#4da3ff", "#7d6bff", "#ff9d4d", "#3ddc97", "#ff6b8a", "#5ad2e6", "#c084fc", "#f5c542"];
const LINES = [
  "我倾向先定义清楚「技术负责人」的产出，再谈人选。",
  "这个项目的瓶颈在联调，谁愿意盯日志谁上。",
  "从架构看，先拆出稳定的接口层比选人更急。",
  "我投给能把评审意见落地的人，而不是话最密的人。",
  "如果只能选一个，我选最熟悉宿主加载链路的那位。",
  "别忘了回滚方案，负责人要能背这个锅。",
  "我先保留意见：这个题面本身有歧义。",
  "我同意前面，但补充一点：排期要写进职责。"
];

function fit(){
  const s = Math.min(window.innerWidth / STAGE_W, window.innerHeight / STAGE_H);
  document.getElementById('fit').style.transform = `translate(-50%,-50%) scale(${s})`;
}
window.addEventListener('resize', fit);

(async () => {
  fit();
  const q = new URLSearchParams(location.search);
  const isStatic = q.get('static') === '1';
  const forcedMouth = q.has('mouth') ? Number(q.get('mouth')) : null;
  const keepIdle = q.get('idle') === '1';
  const keepPhones = q.get('phones') === '1';
  const freeze = q.get('freeze') === '1';
  const noChairs = q.get('nochairs') === '1';
  const count = Math.max(2, Math.min(8, Number(q.get('n') || 8)));
  const app = new PIXI.Application({ view: document.getElementById('seats'), width: STAGE_W, height: STAGE_H, backgroundAlpha: 0, antialias: true });
  const chairs = document.getElementById('chairs');
  const plates = document.getElementById('plates');
  const bubbles = document.getElementById('bubbles');

  const usable = STAGE_W - 150;
  const step = usable / count;
  const charH = q.has('h') ? Math.max(120, Math.min(700, Number(q.get('h'))))
    : Math.round(Math.max(200, Math.min(430, 420 - count * 22)));
  const xs = [];
  for (let i = 0; i < count; i++) xs.push(75 + step * (i + 0.5));

  const seats = [];
  const chairH = Math.round(charH * 1.15);
  const chairW = Math.round(chairH * 2 / 3);
  xs.forEach((x, i) => {
    const img = document.createElement('img');
    img.src = '../assets/chairs/chair-long-back.png';
    img.style.cssText = `position:absolute;left:${Math.round(x - chairW/2)}px;top:${BASE_Y - Math.round(chairH*0.78)}px;width:${chairW}px;opacity:.92;filter:brightness(.58) saturate(.75)`;
    if (!noChairs) chairs.appendChild(img);

    const p = document.createElement('div');
    p.className = 'plate';
    p.style.left = x + 'px';
    p.style.top = (TABLE_TOP + 4) + 'px';
    p.innerHTML = `<span class="dot" style="background:${HUES[i % 8]}"></span>${NAMES[i % 8]}`;
    plates.appendChild(p);

    const b = document.createElement('div');
    b.className = 'bubble';
    b.style.left = x + 'px';
    b.style.top = (BASE_Y - charH - 26) + 'px';
    b.innerHTML = `<span class="who">${NAMES[i % 8]}</span><span class="body"></span>`;
    bubbles.appendChild(b);

    seats.push({
      i, x, speaking: false, mouth: 0, bubble: b, model: null,
      // 每个座位一套随机待机参数：呼吸快慢、浮动幅度、摇摆/转头节奏都不同
      wobble: {
        bobPeriod: 3000 + Math.random() * 2200,
        bobAmp: 1.1 + Math.random() * 1.3,
        swayPeriod: 4200 + Math.random() * 3200,
        swayAmp: 0.7 + Math.random() * 1.1,
        turnPeriod: 5200 + Math.random() * 4800,
        turnAmp: 2.2 + Math.random() * 4.0,
        phase: Math.random() * Math.PI * 2
      }
    });
  });

  const PHONE_PARTS = ['Part106', 'Part6', 'Part107'];
  const PHONE_PARAMS = ['phone', 'phone2', 'phone3', 'phone4', 'phone5', 'phone6', 'phone7', 'phone8'];

  // 鲸鱼娘原版 idle 动作是掏手机看手机；圆桌里不需要，停掉动作并隐藏手机相关部件
  function dropPhonePose(model) {
    try { model.internalModel.motionManager.stopAllMotions(); } catch (e) { /* ignore */ }
    try {
      const core = model.internalModel.coreModel;
      for (const id of PHONE_PARTS) { try { if (!keepPhones) core.setPartOpacityById(id, 0); } catch (e) { /* ignore */ } }
      for (const id of PHONE_PARAMS) { try { core.setParameterValueById(id, 0); } catch (e) { /* ignore */ } }
      core.update();
    } catch (e) { /* ignore */ }
  }

  document.getElementById('status').textContent = '加载 Live2D…';
  let loaded = 0;
  await Promise.all(seats.map(async s => {
    try {
      const model = await PIXI.live2d.Live2DModel.from('../assets/models/whale-girl/c_0120.model3.json', { autoInteract: false, autoUpdate: !freeze });
      model.scale.set(charH / model.height);
      model.anchor.set(0.5, 1);
      model.position.set(s.x, BASE_Y);
      model.zIndex = s.i;
      app.stage.addChild(model);
      if (keepIdle) model.motion('idle');
      else if (freeze) {
        if (!keepPhones) {
          try {
            const core = model.internalModel.coreModel;
            for (const id of PHONE_PARTS) { try { core.setPartOpacityById(id, 0); } catch (e) { /* ignore */ } }
          } catch (e) { /* ignore */ }
        }
        model.update(0);
      }
      else dropPhonePose(model);
      s.model = model;
      loaded++;
    } catch (e) { console.error('load failed', s.i, e); }
  }));
  document.getElementById('status').textContent = `模型 ${loaded}/${count} · 角色高 ${charH}px`;

  const t0 = performance.now();
  let frames = 0, lastFps = t0;
  app.ticker.add(() => {
    if (freeze) return;
    const t = performance.now() - t0;
    frames++;
    if (t - lastFps > 700) {
      document.getElementById('fps').textContent = Math.round(frames * 1000 / (t - lastFps));
      frames = 0; lastFps = t;
    }
    for (const s of seats) {
      if (!s.model) continue;
      const w = s.wobble;
      if (forcedMouth !== null) s.mouth = forcedMouth;
      else if (s.speaking) s.mouth = 0.12 + 0.88 * Math.abs(Math.sin(t / 140));
      else s.mouth *= 0.86;

      let nod, lean, turn, breath;
      if (s.speaking) {
        // 发言：所有座位共用同一套动作，节奏由全局时间决定，保证整齐
        const sp = t / 1000;
        nod = 7 * Math.sin(sp * 3.1);
        lean = 3.2 * Math.sin(sp * 1.55);
        turn = 1.5 * Math.sin(sp * 1.1);
        breath = 0.5 + 0.5 * Math.sin(sp * 1.7);
        s.model.y = BASE_Y - 3;
        s.model.rotation = 0;
      } else {
        // 待机：随机呼吸/摇摆/转头，每人节奏不同，避免整齐划一
        nod = 1.4 * Math.sin(t / w.bobPeriod + w.phase * 0.7);
        lean = w.swayAmp * Math.sin(t / w.swayPeriod + w.phase);
        turn = w.turnAmp * Math.sin(t / w.turnPeriod + w.phase * 1.7);
        breath = 0.5 + 0.5 * Math.sin(t / w.bobPeriod + w.phase);
        s.model.y = BASE_Y + Math.sin(t / w.bobPeriod + w.phase) * w.bobAmp;
        s.model.rotation = Math.sin(t / (w.swayPeriod * 0.8) + w.phase) * 0.003;
      }

      try {
        const core = s.model.internalModel.coreModel;
        // 鲸鱼娘模型只绑了头/身角度参数，张嘴参数无效；发言用点头 + 轻微前倾表达
        core.setParameterValueById('ParamAngleX', turn);
        core.setParameterValueById('ParamAngleY', nod);
        core.setParameterValueById('ParamBodyAngleZ', lean);
        core.setParameterValueById('ParamMouthOpenY', s.mouth);
        if (!keepIdle) {
          for (const id of PHONE_PARAMS) { try { core.setParameterValueById(id, 0); } catch (e) { /* ignore */ } }
          try { core.setParameterValueById('ParamBreath', breath); } catch (e) { /* ignore */ }
        }
        core.update();
      } catch (e) { /* ignore */ }
    }
  }, null, PIXI.UPDATE_PRIORITY.LOW);

  function showBubble(i, text) {
    const s = seats[i];
    s.bubble.querySelector('.body').textContent = text.length > 46 ? text.slice(0, 46) + '…' : text;
    s.bubble.classList.add('show');
    document.getElementById('status').textContent = `${NAMES[i]} 发言中…`;
  }
  function hideBubble(i) { seats[i].bubble.classList.remove('show'); }
  function speak(i, ms) {
    const s = seats[i]; s.speaking = true;
    showBubble(i, LINES[i % LINES.length]);
    setTimeout(() => { s.speaking = false; hideBubble(i); document.getElementById('status').textContent = '等待下一位…'; }, ms);
  }

  if (isStatic) {
    speak(Math.min(2, count - 1), 60000);
  } else {
    let turn = 1;
    setInterval(() => { speak(turn % count, 2000); turn++; }, 2600);
    speak(0, 2000);
  }

  requestAnimationFrame(() => requestAnimationFrame(() => {
    const info = seats.map(s => {
      if (!s.model) return { i: s.i, ok: false };
      const b = s.model.getBounds();
      return { i: s.i, ok: true, left: Math.round(b.left), right: Math.round(b.right), top: Math.round(b.top), bottom: Math.round(b.bottom) };
    });
    document.body.dataset.debug = JSON.stringify({ loaded, count, charH, step: Math.round(step), fps: document.getElementById('fps').textContent, xs: xs.map(Math.round), info });
    window.__stageReady = true;
  }));
})().catch(e => {
  document.getElementById('status').textContent = '加载失败: ' + e.message;
  console.error(e);
});
</script>
</body>
</html>
