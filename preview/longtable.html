<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>圆桌会议 · 长桌原型</title>
<style>
  html,body{margin:0;height:100%;background:#0b0f18;color:#e8eef8;font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif;overflow:hidden}
  #fit{position:absolute;left:50%;top:50%;transform-origin:50% 50%}
  #stage{position:relative;width:1400px;height:920px;transform-origin:0 0;
    background:radial-gradient(120% 90% at 50% 0%,#1a2333 0%,#121826 45%,#0a0d14 100%);overflow:hidden}
  #stage:before{content:"";position:absolute;inset:0;background:
    radial-gradient(60% 40% at 50% 20%,rgba(120,170,255,.10),transparent 70%);pointer-events:none}
  .head{position:absolute;left:0;right:0;top:20px;text-align:center;z-index:30}
  .head h1{margin:0;font-size:19px;font-weight:600;letter-spacing:.08em;color:#dbe7ff}
  .head p{margin:5px 0 0;font-size:12.5px;color:#8fa3c4;max-width:860px;margin-inline:auto;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #chairs,#plates,#bubbles{position:absolute;inset:0}
  #chairs{z-index:1}
  #seats{z-index:2;position:absolute;left:0;top:0}
  #table{z-index:3;position:absolute;left:0;top:585px;width:1400px;height:350px;
    background:url("../assets/table-long.png") center/100% 100% no-repeat;filter:drop-shadow(0 22px 26px rgba(0,0,0,.5))}
  #tabletext{z-index:6;position:absolute;left:440px;top:700px;width:520px;text-align:center;
    font-size:14.5px;line-height:1.6;color:#f3ead8;text-shadow:0 2px 10px rgba(0,0,0,.65)}
  #tabletext b{display:block;font-size:11px;letter-spacing:.32em;color:#c9a86a;margin-bottom:5px;font-weight:600}
  #plates{z-index:7;pointer-events:none}
  .plate{position:absolute;transform:translate(-50%,0);padding:2px 9px;border-radius:999px;
    background:rgba(10,15,24,.74);border:1px solid rgba(140,170,220,.28);color:#cfe0ff;font-size:11.5px;
    white-space:nowrap;backdrop-filter:blur(3px)}
  .plate .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
  #bubbles{z-index:8;pointer-events:none}
  .bubble{position:absolute;transform:translate(-50%,-100%);width:210px;padding:8px 11px;border-radius:13px;
    background:linear-gradient(180deg,rgba(247,250,255,.97),rgba(227,236,250,.97));color:#182233;
    font-size:12px;line-height:1.5;box-shadow:0 10px 24px rgba(0,0,0,.45);
    opacity:0;transition:opacity .16s ease}
  .bubble.show{opacity:1}
  .bubble:after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;width:14px;height:14px;
    background:rgba(232,239,251,.97);transform:rotate(45deg);border-radius:3px}
  .bubble .who{display:block;font-size:10px;letter-spacing:.05em;color:#5b6f92;margin-bottom:2px}
  #hud{position:absolute;right:16px;top:16px;z-index:20;font-size:11px;color:#7e93b5;text-align:right}
  #hud b{color:#b8cdf0}
  #foot{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:11px;color:#5f7290;z-index:20}
</style>
</head>
<body>
<div id="fit"><div id="stage">
  <div class="head">
    <h1>圆桌会议 · 长桌模式</h1>
    <p id="topic">议题：如果模型可以投票，谁最适合做这个项目的技术负责人？</p>
  </div>
  <div id="chairs"></div>
  <canvas id="seats" width="1400" height="920"></canvas>
  <div id="table"></div>
  <div id="tabletext"><b>TOPIC</b><span id="tableTopic">技术负责人怎么选？</span></div>
  <div id="plates"></div>
  <div id="bubbles"></div>
  <div id="hud"><b id="fps">--</b> fps<br><span id="status">加载模型…</span></div>
  <div id="foot">长桌原型 · 全部正面朝屏 · Live2D 鲸鱼娘（CC BY-NC-SA 4.0）</div>
</div></div>

<script src="../assets/vendor/live2dcubismcore.min.js"></script>
<script src="../assets/vendor/pixi.min.js"></script>
<script src="../assets/vendor/cubism4.min.js"></script>
<script>
// 运行期异常收集：ticker 里任何一次抛错都会让「眨眼/动作/换姿势」静默失效，
// 而无头截图看不到 console，所以把错误挂到 overlay 上（?debug=1）。
window.__errs = [];
window.addEventListener('error', e => {
  if (window.__errs.length < 4) window.__errs.push(String(e.message || e));
});
window.addEventListener('unhandledrejection', e => {
  if (window.__errs.length < 4) window.__errs.push('rejection: ' + String((e.reason && e.reason.message) || e.reason));
});
const STAGE_W = 1400, STAGE_H = 920;
// 舞台是固定 1400x920 的逻辑坐标，靠 CSS transform 缩放贴合窗口。
// 大屏上如果只放大位图，五官（尤其嘴）会被糊成一片 —— 所以把渲染表面按
// 「CSS 缩放 x 设备像素比」提高分辨率，逻辑坐标不变，实际像素变多。
let APP = null;
const TABLE_TOP = 600;
const BASE_Y = 668;               // 脚底基线，桌沿以下的部分被桌面遮住
// 8 席演示名单。?names=Grok,Claude,Gemini 可以覆盖它（只在预览里用：
// 要在长桌上看见某个刚做好的角色，不必改文件、也不必动默认阵容）
const NAMES_DEFAULT = ["DeepSeek", "Qwen", "GLM", "Kimi", "Claude", "GPT", "Gemini", "Doubao"];
const NAMES = (() => {
  const raw = new URLSearchParams(location.search).get('names');
  const list = raw ? raw.split(',').map(v => v.trim()).filter(Boolean) : [];
  return list.length ? list : NAMES_DEFAULT;
})();
const HUES  = ["#4da3ff", "#7d6bff", "#ff9d4d", "#3ddc97", "#ff6b8a", "#5ad2e6", "#c084fc", "#f5c542"];
// 个别座位可以换自己的模型；没列出的座位继续用鲸鱼娘 c_0120
const MODELS = {
  GPT: {
    url: '../assets/build/gpt-p2l/p2l/gpt.model3.json',
    // 母图的脸中心在 x=1135（画布中线 1024 偏右 111px），anchor(0.5,1) 会让脸看着歪
    faceDx: 111,
    // 半身像：头占画布 57%（鲸鱼娘全身像只有 ~31%），0.85 才和邻居齐平；
    // 缩小后下巴会掉到桌沿以下，所以再整体上提 25px 补回来。
    // dy 在 charH=182（8 席）下调好，同 Claude 一样按 charH 等比缩放
    scale: 0.85,
    dy: -25,
    dyCharH: 182
  },
  Claude: {
    url: '../assets/build/claude-v3/model/claude.layout.model3.json',
    // 全身像（3 头身，墨迹 1836px 高）：按 charH/2048 缩放后头高 76.8px，与 GPT(0.85×756px→76.6px) 齐平。
    // 但全身像的“脚底”比半身像低 44px，直接摆下巴会悬在桌沿之上；以眼睛高度对齐邻居，
    // 实测 dy=0 时眼线比 GPT 高 36px，故下移 30
    // 3 头身全身像：台上只露「腰以上」。桌面 y=600 是可见下界，所以把她下移到
    // 「腰线正好落在桌沿」——全身像的裙腰在模型画布 y≈992/2048 处（距脚底 1056px），
    // 于是 dy = 600 + 1056k - BASE_Y；1.80 让露出来的头胸与 GPT 一样大。
    scale: 1.8,
    dy: 160,
    // dy 是在 charH=244（设计稿尺度）下调好的**舞台像素**偏移。座位数一变 charH
    // 跟着变，模型可见高度线性缩放而固定 dy 不缩：8 席（charH≈194）时全身像会
    // 沉到腰线以下 34px，只剩头露在桌沿上，待机动作全打在头上读作鬼畜抖动
    // （2026-11-05 实测）。落位时按 charH/dyCharH 等比缩放，3 帧行为不变。
    dyCharH: 244,
    cut: true,
    // v2（PSD2Live layout manifest 出模）把睁眼三件绑到 ParamEyeLOpen/ROpen，
    // 所以这一座位可以由舞台自己驱动眨眼；闭眼件是常显层，眼睛=1 时被睁眼件盖住
    blink: true,
    // 待机里随机做的几个小动作（纯参数合成，不播放 motion，避免和每帧写参数打架）
    gestures: true,
    // 前发微摆：PhysicsHairFront 被关掉了（整块网格同时含刘海与侧发，软阈值会把刘海拖到眼上），
    // 但完全不动又像蜡像。这里只用一个很轻的参数摆动补回呼吸感——振幅 0.12 以内肉眼只见到「活着」，
    // 超过 0.25 前发就会开始左右甩、露出额头上的皮肤接缝。
    sway: true,
    // 抱书版：同一个座位叠的第二层，用 __setPose(4,'alt') / ?pose=4:alt 交叉淡化。
    // 这套 moc3 没有 handwear，tome 和双手是同一条 objects 画件（见 copilot 笔记）
    alt: { url: '../assets/build/claude-book-model/claude-book.layout.model3.json' }
  },
  Gemini: {
    url: '../assets/build/gemini-v1/gemini.layout.model3.json',
    // 全身 Q 版（3 头身，墨迹 1836px 高，同 Claude 管线）：同款「腰线落桌沿」坐姿。
    // scale 1.8 / dy 160 先按 Claude 的数值起步，座位截图后再微调。
    scale: 1.8,
    dy: 160,
    dyCharH: 244,
    cut: true,
    blink: true,
    gestures: true,
    sway: true
  },
  Grok: {
    url: '../assets/build/grok-v1/grok.layout.model3.json',
    // 全身 Q 版（管线 B 逐件 + 母图头部底版）。她的画稿头位比 Claude 低 171 画布像素、
    // 脸也小一号：直接沿用 Claude 的 1.8/160 会读成「矮小半个头」。1.90 把眼距放大到与
    // Claude 相同（352×1.90 ≈ 371×1.80），140 再把眼线抬回邻居的高度——
    // 这一对数值是按「眼线在任何 charH 下都齐平」解出来的，不是只对齐设计稿那一档。
    scale: 1.90,
    dy: 140,
    dyCharH: 244,
    cut: true,
    blink: true,
    gestures: true,
    sway: true,
    // 斧头在她的 PartExtra 里：默认整层透明，只有 axe 动作把它淡进来（见 AXE_GESTURE）
    axePart: 'PartExtra'
  }
};
const LINES = [
  "我倾向先定义清楚「技术负责人」的产出，再谈人选。",
  "这个项目的瓶颈在联调，谁愿意盯日志谁上。",
  "从架构看，先拆出稳定的接口层比选人更急。",
  "我投给能把评审意见落地的人，而不是话最密的人。",
  "如果只能选一个，我选最熟悉宿主加载链路的那位。",
  "别忘了回滚方案，负责人要能背这个锅。",
  "我先保留意见：这个题面本身有歧义。",
  "我同意前面，但补充一点：排期要写进职责。"
];

// 自适应分辨率：舞台逻辑尺寸固定 1400×920，实际渲染缓冲 = baseRes()×quality。
// 弱机器（集成显卡 / 6~8 个座位同屏）会把 quality 降下来保住帧率，画面略软但不再卡顿。
let quality = 1;
let qAuto = true;
function baseRes(){
  return Math.min(3, Math.max(1,
    Math.min(window.innerWidth / STAGE_W, window.innerHeight / STAGE_H) * (window.devicePixelRatio || 1)));
}

function fit(){
  const s = Math.min(window.innerWidth / STAGE_W, window.innerHeight / STAGE_H);
  document.getElementById('fit').style.transform = `translate(-50%,-50%) scale(${s})`;
  if (APP) {
    const r = baseRes() * quality;
    if (Math.abs(APP.renderer.resolution - r) > 0.01) {
      APP.renderer.resolution = r;
      APP.renderer.resize(STAGE_W, STAGE_H);
    }
  }
}
window.addEventListener('resize', fit);

(async () => {
  fit();
  const q = new URLSearchParams(location.search);
  const isStatic = q.get('static') === '1';
  const forcedMouth = q.has('mouth') ? Number(q.get('mouth')) : null;
  // 用 ?pose= 或 __setPose() 手动定住姿势时，关掉自动抱起/放下
  let pinnedPose = q.has('pose') ? 1 : null;
  const keepIdle = q.get('idle') === '1';
  const keepPhones = q.get('phones') === '1';
  const freeze = q.get('freeze') === '1';
  // 调试用：时钟钉在 0 但照常写参数（freeze 会整帧 return，参数压根不被写进去）
  const still = q.get('still') === '1';
  // 调试用：把时钟钉在某个毫秒值。still=1 只给 t=0 一个采样点，看不出
  // 「说话时头部是否跟着音节动」——tpin 可以取多个采样点，读 poseDbg 比对。
  const tPin = q.has('tpin') ? Number(q.get('tpin')) : null;
  // 调试用：只加载指定座位的模型（8 个模型一起加载会拖慢无头截图）
  const soloSeat = q.has('solo') ? Number(q.get('solo')) : null;
  // 调试用：只加载列表里的座位，如 ?only=4,5（无头截图时 6 个模型太重会挂）
  const onlySeats = q.has('only')
    ? new Set(q.get('only').split(',').map(v => parseInt(v, 10)).filter(v => !isNaN(v)))
    : null;
  // 调试用：强制某个座位一直在发言（截图验证口型）
  const speakSeat = q.has('speak') ? Number(q.get('speak')) : null;
  const noChairs = q.get('nochairs') === '1';
  // 截图校验用：?eye=0 把眼睛钉在闭、?gest=nod:0.5 把某个小动作钉在包络的某一相位
  const pinEye = q.has('eye') ? Math.max(0, Math.min(1, Number(q.get('eye')))) : null;
  // ?gest=happy:0.5 pins one idle gesture at a phase of its envelope (for stills).
  // Without this the ticker threw a ReferenceError here every frame, which meant
  // no gesture *and* no blink ever reached the model.
  const forceGest = (() => {
    const raw = q.get('gest');
    if (!raw) return null;
    const [id, u] = raw.split(':');
    return { id, u: Math.max(0, Math.min(1, Number(u ?? 0.5))) };
  })();
  // ?nogest=1 关掉自动小动作：静帧截图要看「标准姿势」时必须能关，
  // 否则随机抓到的可能是 happy 的 ^^ 眼或 tilt 的歪头。
  const noGest = q.get('nogest') === '1';
const count = Math.max(2, Math.min(8, Number(q.get('n') || 8)));
  // ?q=off 关掉自适应；?qforce=0.6 把 quality 钉死（对比截图 / 复现性能问题用）
  if (q.get('q') === 'off') qAuto = false;
  if (q.has('qforce')) {
    qAuto = false;
    quality = Math.max(0.4, Math.min(1, Number(q.get('qforce')) || 1));
  }
  // 2048 atlases are drawn at ~0.1 scale on the stage; without mipmaps a
// 1px outline aliases into a stair-stepped halo ("edges look rough").
if (PIXI.BaseTexture && PIXI.BaseTexture.defaultOptions) {
  PIXI.BaseTexture.defaultOptions.mipmap = PIXI.MIPMAP_MODES.ON;
}
const app = new PIXI.Application({
    view: document.getElementById('seats'), width: STAGE_W, height: STAGE_H,
    backgroundAlpha: 0, antialias: true, autoDensity: true,
    resolution: baseRes() * quality
  });
  APP = app;
  fit();
  // 模型是并发加载的，不排序的话 zIndex 无效，相邻座位的尾巴会盖到别人脸上
  app.stage.sortableChildren = true;
  const chairs = document.getElementById('chairs');
  const plates = document.getElementById('plates');
  const bubbles = document.getElementById('bubbles');

  // 座位横向预算：先给相邻座位留出「缝」，再让人物/椅子各自缩进缝里，
  // 这样 8 人时椅子不再是连成一块的深色木板，人物之间也留出一点空气。
  const MARGIN = 40;
  const usable = STAGE_W - MARGIN * 2;
  const step = usable / count;
  const gapChair = Math.round(Math.max(6, Math.min(46, step * 0.13)));  // 椅子之间的缝
  const gapChar  = Math.round(Math.max(3, Math.min(26, step * 0.06)));  // 人物之间的缝
  const charSlot = step - gapChar;
  const CHAR_ASPECT = 0.85;      // 实测：人物轮廓宽 / 角色高（含头发与尾巴）
  const maxH = 420 - count * 22; // 座位越多人物越矮，避免顶到标题
  const charH = q.has('h') ? Math.max(120, Math.min(700, Number(q.get('h'))))
    : Math.round(Math.max(140, Math.min(maxH, charSlot / CHAR_ASPECT)));
  const xs = [];
  for (let i = 0; i < count; i++) xs.push(MARGIN + step * (i + 0.5));

  const seats = [];
  // 椅子按素材 600×900 的比例缩放（不压扁），宽度不超过「座位宽 - 椅缝」
  const chairW = Math.round(Math.min(charH * 1.15 * 2 / 3, step - gapChair));
  const chairH = Math.round(chairW * 1.5);
  xs.forEach((x, i) => {
    const img = document.createElement('img');
    img.src = '../assets/chairs/chair-long-back.png';
    img.style.cssText = `position:absolute;left:${Math.round(x - chairW/2)}px;top:${BASE_Y - Math.round(chairH*0.78)}px;width:${chairW}px;opacity:.92;filter:brightness(.58) saturate(.75)`;
    if (!noChairs) chairs.appendChild(img);

    const p = document.createElement('div');
    p.className = 'plate';
    p.style.left = x + 'px';
    p.style.top = (TABLE_TOP + 4) + 'px';
    p.innerHTML = `<span class="dot" style="background:${HUES[i % 8]}"></span>${NAMES[i % NAMES.length]}`;
    plates.appendChild(p);

    const b = document.createElement('div');
    b.className = 'bubble';
    b.style.left = x + 'px';
    b.style.top = (BASE_Y - charH - 26) + 'px';
    b.innerHTML = `<span class="who">${NAMES[i % NAMES.length]}</span><span class="body"></span>`;
    bubbles.appendChild(b);

    // 待机相位用固定种子：无头验收要能复现同一帧，纯 Math.random() 会让 ?tpin=
// 变成碰运气（同一个 tpin 每次得到不同相位，动作永远对不上）。
  const seedBase = q.has('seed') ? (Number(q.get('seed')) | 0) : 20261103;
  const rnd = (() => {
    let a = seedBase >>> 0;
    return () => {
      a = (a + 0x6D2B79F5) >>> 0;
      let x = a;
      x = Math.imul(x ^ (x >>> 15), x | 1);
      x ^= x + Math.imul(x ^ (x >>> 7), x | 61);
      return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
    };
  })();

  seats.push({
      i, x, speaking: false, mouth: 0, bubble: b, model: null,
      // 每个座位一套待机参数：呼吸快慢、浮动幅度、摇摆/转头节奏都不同
      wobble: {
        bobPeriod: 3000 + rnd() * 2200,
        bobAmp: 1.1 + rnd() * 1.3,
        swayPeriod: 4200 + rnd() * 3200,
        swayAmp: 0.7 + rnd() * 1.1,
        turnPeriod: 5200 + rnd() * 4800,
        turnAmp: 2.2 + rnd() * 4.0,
        phase: rnd() * Math.PI * 2
      }
    });
  });

  const PHONE_PARTS = ['Part106', 'Part6', 'Part107'];
  const PHONE_PARAMS = ['phone', 'phone2', 'phone3', 'phone4', 'phone5', 'phone6', 'phone7', 'phone8'];

  // 鲸鱼娘原版 idle 动作是掏手机看手机；圆桌里不需要，停掉动作并隐藏手机相关部件
  function dropPhonePose(model) {
    try { model.internalModel.motionManager.stopAllMotions(); } catch (e) { /* ignore */ }
    try {
      const core = model.internalModel.coreModel;
      for (const id of PHONE_PARTS) { try { if (!keepPhones) core.setPartOpacityById(id, 0); } catch (e) { /* ignore */ } }
      for (const id of PHONE_PARAMS) { try { core.setParameterValueById(id, 0); } catch (e) { /* ignore */ } }
      core.update();
    } catch (e) { /* ignore */ }
  }

  // pixi 的自动眨眼每帧会自己写 ParamEyeLOpen：既覆盖 blinkValue() 的曲线，又让主层和
  // 第二姿势层各眨各的——座位静帧常随机拍在半睁上，看起来像「眼睛变小」。关掉它，
  // 眨眼只由 blinkValue() 一条曲线驱动，两层因此逐帧一致。
  function dropAutoBlink(model) {
    try { if (model && model.internalModel) model.internalModel.eyeBlink = undefined; } catch (e) { /* ignore */ }
  }

  // 主/备两层必须写同一套参数，否则交叉淡化时表情会跳
  // 逐参数 try：鲸鱼娘/GPT 的 moc3 没有这里的某些参数（眼球、眉毛），缺一个不能连累后面
  function sv(core, id, v) {
    if (v === undefined) return;
    try { core.setParameterValueById(id, v); } catch (e) { /* 该模型没有这个参数 */ }
  }
  function applyPoseParams(model, p) {
    try {
      const core = model.internalModel.coreModel;
      sv(core, 'ParamAngleX', p.turn);
      sv(core, 'ParamAngleY', p.nod);
      sv(core, 'ParamAngleZ', p.tilt);
      sv(core, 'ParamBodyAngleZ', p.lean);
      sv(core, 'ParamMouthOpenY', p.mouth);
      sv(core, 'ParamMouthForm', p.mform);
      sv(core, 'ParamEyeBallX', p.eyeX);
      sv(core, 'ParamEyeBallY', p.eyeY);
      // v3 的 ^^ 笑眼：一条叠在睁眼之上的画件，toggle 绑在 ParamEyeBallForm 上
      sv(core, 'ParamEyeBallForm', p.happy);
      // v3 的前发是刚性跟头（物理已关），这个参数仍然驱动它的额外摆动。
      // 夹在 ±0.22：前发网格在根部只和相邻件叠 2–3px，超过 0.25 侧发就会甩开，
      // 露出「额头/侧颈的接缝」。2026-11-06 用 probe 逐值量过（品红底、数封闭洞）：
      // Gemini 在 hf=0 时最大的洞 912px²，hf=+1 时涨到 6092px² —— 深色舞台上就是
      // 一块会动的黑斑。Claude 同一套管线，注释里也写着 0.25 是上限。
      sv(core, 'ParamHairFront', Math.max(-0.22, Math.min(0.22, p.hair)));
      // 只有把眼睛绑成 toggle 变体的模型（Claude v2）才能靠参数眨眼：
      // 1 显示睁眼三件、0 露出常显的闭眼件。没绑的模型不能写这个参数。
      if (p.eye !== undefined) {
        core.setParameterValueById('ParamEyeLOpen', p.eye);
        core.setParameterValueById('ParamEyeROpen', p.eye);
      }
      // 单眼眨眼（wink）：v3 把左右睁眼件分别绑在两个参数上，所以可以只关一只。
      // 放在整体眨眼之后，wink 优先。
      if (p.eyeL !== undefined) core.setParameterValueById('ParamEyeLOpen', p.eyeL);
      if (p.eyeR !== undefined) core.setParameterValueById('ParamEyeROpen', p.eyeR);
      if (p.brow !== undefined) {
        sv(core, 'ParamBrowLY', p.brow);
        sv(core, 'ParamBrowRY', p.brow);
      }
      if (!keepIdle) {
        for (const id of PHONE_PARAMS) { try { core.setParameterValueById(id, 0); } catch (e) { /* ignore */ } }
        sv(core, 'ParamBreath', p.breath);
      }
      // 道具部件（Grok 的斧头在 PartExtra）：部件透明度每帧会被核心的 drawable
      // opacity 覆盖，所以这里不写就等于恒为 1——必须在 core.update() 之前写。
      if (model.__axePart) {
        try { core.setPartOpacityById(model.__axePart, p.axe || 0); } catch (e) { /* 该模型没有这个部件 */ }
      }
      core.update();
    } catch (e) { /* ignore */ }
  }

  // 待机小动作：纯参数偏移，时长 dur 毫秒，env = sin(πu) 做出"起-落"的包络。
  // 之所以不用 model.motion()：舞台每帧都在写同一批参数，动作曲线会被覆盖成抖。
  // Only parameters that are actually rigged to art are used here.  Measured on
  // the v3 moc3 (probe.html, one param at a time): ParamAngleX/Y/Z, ParamBodyAngle*,
  // ParamBodyLean, ParamProportion, ParamBreath, ParamHairFront and
  // ParamEyeLOpen/ROpen/ParamEyeBallForm move pixels; ParamMouthForm,
  // ParamBrowLY/RY and ParamEyeBallX/Y do not (and ParamEyeBallForm only because
  // the v3 squint layer is bound to it).  An earlier set of gestures leaned on the
  // placebo params, i.e. it animated nothing.
  const env = u => Math.sin(Math.PI * u);
  const GESTURES = [
    { id: 'nod',     dur: 1250, f: u => ({ nod: -17 * env(u), lean: 1.5 * env(u) }) },
    { id: 'bow',     dur: 1700, f: u => ({ nod: -24 * env(u), lean: 5 * env(u) }) },
    // Two swings over 1 s (~2 Hz) at ±8 degrees: the old ±8/4-swing version threw the
    // side locks across the face fast enough to read as two layers coming apart.
    // `hair` trails the swing by a quarter cycle so the mass follows through.
    { id: 'shake',   dur: 1000, f: u => ({ turn: 8 * Math.sin(Math.PI * 2 * u) * env(u), hair: -0.10 * Math.cos(Math.PI * 2 * u) * env(u) }) },
    { id: 'tilt',    dur: 1400, f: u => ({ tilt: 14 * env(u) }) },
    { id: 'look',    dur: 1700, f: u => ({ turn: 20 * env(u), tilt: 5 * env(u) }) },
    { id: 'glance',  dur: 1300, f: u => ({ turn: -14 * env(u), tilt: -5 * env(u) }) },
    { id: 'think',   dur: 1900, f: u => ({ tilt: 10 * env(u), nod: -6 * env(u), hair: 0.3 * env(u), mform: env(u) }) },
    { id: 'smile',   dur: 2100, f: u => ({ happy: env(u) > 0.2 ? 1 : 0, tilt: 6 * env(u), nod: -3 * env(u) }) },
    { id: 'happy',   dur: 1600, f: u => ({ happy: env(u) > 0.2 ? 1 : 0, nod: -7 * env(u) }) },
    { id: 'huh',     dur: 1300, f: u => ({ tilt: -9 * env(u), nod: 6 * env(u), happy: 0, mform: 0.8 * env(u) }) },
    { id: 'leanin',  dur: 1600, f: u => ({ lean: 10 * env(u), nod: -7 * env(u) }) },
    // 甩发：振幅 0.20 而不是 1.0。「扔头发」听起来要甩到底，但前发只有根部
    // 2–3px 的重叠，1.0 会把侧发甩离头皮（见 applyPoseParams 里的封顶注释）。
    { id: 'hairtoss', dur: 1200, f: u => ({ hair: 0.20 * Math.sin(Math.PI * u * 2) * env(u), turn: 8 * env(u) }) },
    // 单眼眨眼：左右睁眼件分别绑在 ParamEyeLOpen/ROpen 上，所以能只关一只。
    // 收得快、放得慢一点点，比整体眨眼更像「抛个眼神」而不是抽搐。
    { id: 'wink', dur: 950, f: u => {
      const k = u < 0.16 ? u / 0.16 : u > 0.62 ? Math.max(0, (0.88 - u) / 0.26) : 1;
      return { winkL: 1 - k, tilt: 3.5 * env(u) };
    } },
    // 道具动作：斧头在 Grok 的 PartExtra 部件里，这里返回的是 0..1 的部件透明度。
    // 0.12 的上升（≈360ms）比 0.22 的收（≈660ms）快一点，读起来是「召出来」而不是滑进来。
    // 只会被她自己的动作池抽到（见 gestureOffsets）。
    { id: 'axe', dur: 3000, f: u => {
      const r = Math.min(1, u / 0.12), fall = Math.min(1, (1 - u) / 0.22);
      return { axe: Math.max(0, Math.min(r, fall)), nod: 2.4 * env(u), lean: 3 * env(u) };
    } }
  ];
  function gestureOffsets(s, t) {
    if (!s.g) {
      if (t < s.nextG) return null;
      // 负号权重：待机里点头/歪头比摇头更常见；`wink`（12）只给一个权重，抛个眼神就够了
      // 道具动作（13 = axe）只进「有道具部件」的座位池。别的座位抽到它只会白做一个
      // 拍子的动作（axe 通道没人读），所以不能进公共池。
      const idle = [0, 0, 1, 2, 3, 3, 4, 5, 6, 7, 9, 11, 12];
      const pool = s.speaking ? [0, 1, 1, 3, 4, 8, 12] : (s.axePart ? idle.concat(13) : idle);
      const g = GESTURES[pool[Math.floor(Math.random() * pool.length)]];
      s.g = { g, t0: t };
      s.nextG = t + g.dur + 2200 + Math.random() * 5200;
    }
    const u = (t - s.g.t0) / s.g.g.dur;
    if (u >= 1) { s.g = null; return gestureOffsets(s, t); }
    return s.g.g.f(Math.max(0, u));
  }

  // 音节包络（0..1，峰值 = 张口最大）。口型、发言时的点头、以及「换气口眨眼」
  // 用的是同一条曲线，三者的节奏才是一件事，而不是三个各摆各的振荡器。
  function speechEnv(s, t) {
    const sp = t / 1000 + (s.wobble ? s.wobble.phase : 0);
    return Math.abs(Math.sin(sp * 5.5) * 0.72 + Math.sin(sp * 8.9) * 0.28);
  }

  // 眨眼：睁 1 → 闭 0 → 睁 1，闭眼段只占 30%，看起来才像真眨眼而不是慢闭
  // 偶尔连眨两下（间隔 320ms），真人也会这样。
  // 说话时不按随机时钟眨：等到音节包络掉回低谷（换气口）再眨一下，
  // 否则一句话正中间突然闭眼，像卡了一下。
  function blinkValue(s, t) {
    if (s.blinkStart !== undefined) {
      const u = (t - s.blinkStart) / 150;
      if (u >= 0 && u < 1) return u < 0.3 ? 1 - u / 0.3 : (u - 0.3) / 0.7;
    }
    if (s.speaking) {
      // 说话时的眨眼要卡在两件事上：①句读的慢拍（0.35 Hz 的「换气」窗口）
      // ②音节包络落回自己近期均值的 75% 以下（一句话里的小停顿）。
      // 只用 sy < 常数 是不行的：两条正弦是 5.5 / 8.9（黄金比），几乎不会同时过零，
      // sy 长期在 0.5 以上，等阈值等不到眨眼（实测 14 s 里 bl=0）。
      const sy = speechEnv(s, t);
      s.syMean = s.syMean === undefined ? sy : s.syMean * 0.94 + sy * 0.06;
      // 0.55 rad/s ≈ 11 s 一个「句子」；窗口 0.55 大概占 40%（约 4.5 s）。
      const breath = Math.sin(t / 1000 * 0.55 + (s.wobble ? s.wobble.phase : 0));
      if (breath > 0.55 && sy < 0.5 && sy < s.syMean * 0.8) {
        // 2.2 s 的硬间隔：真人 15–20 次/分，不设间隔会眨成 32 次/分（实测）
        if (s.pauseArmed && t - (s.blinkStart ?? -1e9) > 2200) {
          s.pauseArmed = false;
          s.blinkStart = t;
          // 计数 + 记录眨眼时刻的包络高度：无头验证用（应该只在低谷眨）
          s.blinkN = (s.blinkN || 0) + 1;
          s.blinkSy = Math.max(s.blinkSy || 0, sy);
        }
      } else s.pauseArmed = true;
      return 1;
    }
    if (s.blinkAt === undefined) s.blinkAt = t + 900 + Math.random() * 4200;
    if (t >= s.blinkAt) {
      s.blinkStart = s.blinkAt;
      s.blinkAt = t + (Math.random() < 0.22 ? 320 : 2400 + Math.random() * 5600);
    }
    return 1;
  }

  document.getElementById('status').textContent = '加载 Live2D…';
  let loaded = 0;
  await Promise.all(seats.map(async s => {
    try {
      if (soloSeat !== null && s.i !== soloSeat) { loaded++; return; }
      if (onlySeats && !onlySeats.has(s.i)) { loaded++; return; }
      const seatCfg = MODELS[NAMES[s.i % NAMES.length]] || {};
      const modelUrl = seatCfg.url || '../assets/models/whale-girl/c_0120.model3.json';
      const seatH = charH * (seatCfg.scale || 1);
      const model = await PIXI.live2d.Live2DModel.from(modelUrl, { autoInteract: false, autoUpdate: !freeze });
      const modelH = model.height;                 // 2048: 必须在 scale 之前读，之后读到的是缩放后的值
      const k = seatH / modelH;
      model.scale.set(k);
      model.anchor.set(0.5, 1);
      // 脸不在画布中线时按 1:1 像素补偿，让脸回到座位正中
      const faceDx = seatCfg.faceDx ? -seatCfg.faceDx * k : 0;
      s.faceDx = faceDx;
      // dy 按 charH/dyCharH 等比缩放：dy 是在 dyCharH 那档座位数下调好的舞台像素，
      // 模型可见高度随 charH 线性变，偏移量必须同步缩，否则换席位数全身像会沉进桌子
      s.baseY = BASE_Y + (seatCfg.dy || 0) * (charH / (seatCfg.dyCharH || charH));
      model.position.set(s.x + faceDx, s.baseY);
      model.zIndex = s.i;
      app.stage.addChild(model);
      // cut: 全身像的腿会从桌沿以下露出来（桌子只挡从基线往下），按座位基线裁掉，
      // 台上就只剩上半身，与鲸鱼娘/GPT 的半身像一致
      if (seatCfg.cut) {
        const clip = new PIXI.Graphics();
        clip.beginFill(0x000000);
        clip.drawRect(-4000, -4000, 8000, 4000 + BASE_Y);
        clip.endFill();
        app.stage.addChild(clip);
        model.mask = clip;
      }
      dropAutoBlink(model);
      if (keepIdle) model.motion('idle');
      else if (freeze) {
        if (!keepPhones) {
          try {
            const core = model.internalModel.coreModel;
            for (const id of PHONE_PARTS) { try { core.setPartOpacityById(id, 0); } catch (e) { /* ignore */ } }
          } catch (e) { /* ignore */ }
        }
        model.update(0);
      }
      else dropPhonePose(model);
      // 同座位可再叠一层"第二姿势"（如抱书版）：默认全透明，靠 __setPose() 交叉淡化。
      // 两个 moc3 共用同一套部件与同一 transform，所以淡化时只有手臂和书在渐变。
      //
      // 懒加载：第二层自带一整张 4096 图集和一套物理，8 个座位全预载会白吃显存和首屏时间，
      // 而用户第一眼看到的还是空手站着的她。所以只在真的要抱起书时才拉模型。
      s.k = k;
      // 道具部件：applyPoseParams 每帧把它写成 p.axe（默认 0），斧头因此默认不出现
      s.axePart = seatCfg.axePart || null;
      if (s.axePart) model.__axePart = s.axePart;
      const hasAlt = !!(seatCfg.alt && seatCfg.alt.url);
      s.loadAlt = hasAlt ? async () => {
        if (s.altModel) return s.altModel;
        if (s.altPromise) return s.altPromise;
        s.altPromise = (async () => {
          try {
            const alt = await PIXI.live2d.Live2DModel.from(seatCfg.alt.url, { autoInteract: false, autoUpdate: !freeze });
            const altScale = k * (seatCfg.alt.scale || 1);
            alt.scale.set(altScale);
            alt.anchor.set(0.5, 1);
            alt.position.set(s.x + faceDx, s.baseY + (seatCfg.alt.dy || 0));
            alt.zIndex = s.i + 0.001;
            alt.alpha = 0;
            alt.visible = false;
            app.stage.addChild(alt);
            if (seatCfg.cut) {
              const clip = new PIXI.Graphics();
              clip.beginFill(0x000000);
              clip.drawRect(-4000, -4000, 8000, 4000 + BASE_Y);
              clip.endFill();
              app.stage.addChild(clip);
              alt.mask = clip;
            }
            dropPhonePose(alt);
            dropAutoBlink(alt);
            s.altModel = alt;
            s.altBaseY = s.baseY + (seatCfg.alt.dy || 0);
            return alt;
          } catch (e) { console.error('alt load failed', s.i, e); return null; }
        })();
        return s.altPromise;
      } : null;
      s.poseT = 0;
      s.poseTarget = 0;
      s.poseMs = 700;
      // 自动换姿势：空手待机一会儿就把书抱起来，抱一会儿再放下，让"会做动作"看得出来
      s.autoPose = hasAlt && seatCfg.autoPose !== false;
      // 注意：这里必须用与 ticker 同一个时钟。ticker 里的 t = performance.now() - t0，
      // 写 performance.now() + 3000 会被多算一个 t0（页面初始化时间），第一次抱书会晨到 1s 左右。
      s.poseNext = 3000 + Math.random() * 4000;
      s.model = model;
      s.cfg = seatCfg;
      loaded++;
    } catch (e) { console.error('load failed', s.i, e); }
  }));
  document.getElementById('status').textContent = `模型 ${loaded}/${count} · 角色高 ${charH}px`;
  if (q.get('debug') === '1') {
    const d = document.createElement('div');
    d.style.cssText = 'position:absolute;left:8px;top:8px;z-index:30;font:11px/1.5 monospace;color:#9fe;background:rgba(0,0,0,.6);padding:6px;max-width:1380px;white-space:pre-wrap';
    const seatLines = () => seats.map(s => {
      if (!s.model) return `${s.i} x=${Math.round(s.x)} (no model)`;
      const b = s.model.getBounds();
      const p = s.poseDbg;
      const pv = p ? ` turn=${p.turn.toFixed(1)} nod=${p.nod.toFixed(1)} lean=${p.lean.toFixed(1)} tilt=${(p.tilt||0).toFixed(1)} look=${p.look.toFixed(2)} eyeX=${(p.eyeX||0).toFixed(2)} eyeY=${(p.eyeY||0).toFixed(2)} hair=${(p.hair||0).toFixed(3)} sy=${(p.sy||0).toFixed(2)} mo=${(p.mouth||0).toFixed(2)} eye=${(p.eye===undefined?1:p.eye).toFixed(2)} bl=${p.bl||0} blsy=${(p.blsy||0).toFixed(2)} ln=${(p.ln||0).toFixed(3)} g=${p.g}` : '';
      return `${s.i} x=${Math.round(s.x)} mx=${Math.round(s.model.x)} baseY=${Math.round(s.baseY)} b=[${Math.round(b.left)}..${Math.round(b.right)}] w=${Math.round(b.width)}${pv}`;
    }).join('\n');
    const base = `charH=${charH}\n` + seatLines();
    // Texture ledger: a 4096 page is 64 MB decoded, and the stage loads the same
    // model on several seats.  Counting the Textures list in model3.json would
    // count duplicates, so dedupe by baseTexture uid -- that is the number the
    // GPU actually holds.
    const texLine = () => {
      const seen = new Set();
      let bytes = 0, pages = 0;
      for (const k in PIXI.utils.TextureCache) {
        const bt = PIXI.utils.TextureCache[k].baseTexture;
        if (!bt || seen.has(bt.uid)) continue;
        seen.add(bt.uid);
        pages++;
        bytes += bt.realWidth * bt.realHeight * 4;
      }
      return `tex pages=${pages} vram≈${(bytes / 1048576).toFixed(0)}MB`;
    };
    d.textContent = base;
    document.getElementById('stage').appendChild(d);
    // 每 0.5s 刷新：座位行要重算（poseDbg 每帧在变），有异常就把异常贴上来。
    setInterval(() => {
      const errs = window.__errs;
      const head = `charH=${charH}\n` + seatLines();
      d.textContent = errs.length
        ? head + `\n${texLine()}` + `\nERR(${errs.length}): ` + errs.join(' | ')
        : head + `\n${texLine()}` + `\nfps=${document.getElementById('fps').textContent}`;
    }, 500);
  }

  // 听人说话的轻点头可以单独关掉：A/B 验收时除这一项，页面其余状态必须完全一致
  const LISTEN_NOD = q.get('listen') !== '0';
  const t0 = performance.now();
  let frames = 0, lastFps = t0;
  app.ticker.add(() => {
    if (freeze) return;
    const t = still ? 0 : (tPin !== null && Number.isFinite(tPin) ? tPin : performance.now() - t0);
    frames++;
    if (t - lastFps > 700) {
      const fpsNow = Math.round(frames * 1000 / (t - lastFps));
      document.getElementById('fps').textContent = qAuto
        ? `${fpsNow} res=${APP.renderer.resolution.toFixed(2)}`
        : `${fpsNow} res=${APP.renderer.resolution.toFixed(2)} (fixed)`;
      // 自适应：低于 26 帧就往下降一档（最低 0.70，座位尺度下眼睛还能读清），
      // 稳定高于 55 帧再慢慢加回去。只改渲染缓冲，不动舞台坐标/点击区域。
      if (qAuto) {
        if (fpsNow < 26 && quality > 0.70) quality = Math.max(0.70, quality - 0.06);
        else if (fpsNow > 55 && quality < 1) quality = Math.min(1, quality + 0.04);
        const want = baseRes() * quality;
        if (Math.abs(APP.renderer.resolution - want) > 0.03) {
          APP.renderer.resolution = want;
          APP.renderer.resize(STAGE_W, STAGE_H);
        }
      }
      frames = 0; lastFps = t;
    }
    for (const s of seats) {
      if (!s.model) continue;
      // 懒加载的第二层：到时间先把模型拉起来，下一次 tick 才真正开始抱书
      if (s.loadAlt && !s.altModel && s.autoPose && pinnedPose === null && t > (s.poseNext || 0)) {
        s.loadAlt();
        s.poseNext = t + 1500;
      }
      // 姿势交叉淡化：poseT 0=空手版 1=抱书版，按 deltaMS 推进，两端都夹在目标值上
      if (s.altModel) {
        const dd = Math.min(1, (app.ticker.deltaMS || 16.7) / (s.poseMs || 240));
        if (s.poseT < s.poseTarget) s.poseT = Math.min(s.poseTarget, s.poseT + dd);
        else if (s.poseT > s.poseTarget) s.poseT = Math.max(s.poseTarget, s.poseT - dd);
        // 交叉淡化：第二层在前半段淡入、主层在后半段淡出，任何时刻上层都是不透明的，
        // 所以整条曲线不会出现「两层各 20% → 座位背景透出来」的短暂透明。
        // 旧写法把窗口错开成 0.38..0.62 两段，t=0.5 时两层各 0.19，角色会瞬间变淡一层，
        // 看起来像重影/错位。
        s.model.alpha = s.poseT <= 0.5 ? 1 : Math.max(0, 1 - (s.poseT - 0.5) / 0.5);
        s.altModel.alpha = s.poseT <= 0.5 ? Math.min(1, s.poseT / 0.5) : 1;
        s.altModel.visible = s.altModel.alpha > 0.001;
        // 藏起来的时候连物理一起停：第二层看不见却还在逐帧算，8 个座位就是白烧 CPU
        s.altModel.autoUpdate = s.altModel.visible && !freeze;
        // 自动抱起 / 放下：只在两端夹住时排下一次，避免切换中被反复重置
        if (s.autoPose && pinnedPose === null && t > (s.poseNext || 0)
            && Math.abs(s.poseT - s.poseTarget) < 0.01) {
          const holding = s.poseTarget > 0.5;
          s.poseTarget = holding ? 0 : 1;
          s.poseMs = 700;
          s.poseNext = t + (holding ? 9000 + Math.random() * 9000
                                   : 12000 + Math.random() * 12000);
        }
      }
      const w = s.wobble;
      // 音节包络：口型和头部共用同一条曲线（5.5 / 8.9 两条正弦叠出音节感），
      // 头部才有「跟着字往下压」的感觉；各座位相位不同，不是整齐的节拍器。
      // 鲸鱼娘的张嘴参数没绑几何，只有 GPT / Claude 看得出效果。
      const sp = t / 1000 + w.phase;
      const sy = speechEnv(s, t);
      if (forcedMouth !== null) s.mouth = forcedMouth;
      // Snap instead of crossfading: the rig blends a thin smile line with a round
      // hole, and any partial alpha reads as a grey smudge on the cheek.
      else if (s.speaking) s.mouth = sy > 0.32 ? 1 : 0;
      else s.mouth *= 0.86;

      let nod, lean, turn, breath;
      // 听人说话时的点头量（0..1）：只用来在 HUD 上验收，本身不参与渲染
      let listenAmt = 0;
      // 「看发言人」：朝发言座位的方向偏头 + 眼珠轻微跟过去，并做时间平滑，
      // 否则换人发言时所有人会瞬间抽搐一下。
      let look = 0;
      if (speakerI >= 0 && speakerI !== s.i && seats[speakerI]) {
        look = Math.max(-1, Math.min(1, (seats[speakerI].x - s.x) / (STAGE_W * 0.32)));
      }
      s.lookSmooth = (s.lookSmooth ?? 0) * 0.90 + look * 0.10;
      if (s.speaking) {
        // 发言：慢正弦给整句语气，音节包络给每个字的下压 —— 只挂慢正弦时
        // 头是匀速摆的，配上口型就像在念稿（round 22 修的就是这个）。
        const spb = t / 1000;
        nod = 2.6 * Math.sin(spb * 3.1) + 5.2 * (sy - 0.5);
        lean = 3.2 * Math.sin(spb * 1.55) + 1.1 * (sy - 0.5);
        turn = 1.5 * Math.sin(spb * 1.1);
        breath = 0.5 + 0.5 * Math.sin(spb * 1.7);
        s.model.y = (s.baseY ?? BASE_Y) - 3 - 1.6 * (sy - 0.5);
        s.model.rotation = 0;
      } else {
        // 待机：随机呼吸/摇摆/转头，每人节奏不同，避免整齐划一
        nod = 1.4 * Math.sin(t / w.bobPeriod + w.phase * 0.7);
        // 「听人说话」的轻点头：对方发言时每 ~6s 轻轻点一下（sin^6 包络让它只有很短的峰）。
        // 幅度只有 2.6°：大了就像在打盹，不像在听。也不会与自己发言时的音节点头叠加（那一支在 if 里面）。
        if (LISTEN_NOD && speakerI >= 0 && speakerI !== s.i) {
          listenAmt = Math.pow(Math.max(0, Math.sin((t / 1000 + w.phase * 3.7) * 0.92)), 6);
          nod += 2.6 * listenAmt;
        }
        lean = w.swayAmp * Math.sin(t / w.swayPeriod + w.phase);
        turn = w.turnAmp * Math.sin(t / w.turnPeriod + w.phase * 1.7);
        // 朝向发言人：头转 ±7°、身体随 ±2.2°，眼珠再带一点，读得出来但不过火
        turn += s.lookSmooth * 7;
        lean += s.lookSmooth * 2.2;
        breath = 0.5 + 0.5 * Math.sin(t / w.bobPeriod + w.phase);
        s.model.y = (s.baseY ?? BASE_Y) + Math.sin(t / w.bobPeriod + w.phase) * w.bobAmp;
        s.model.rotation = Math.sin(t / (w.swayPeriod * 0.8) + w.phase) * 0.003;
      }

      // 备用层跟随主层的位移和摇摆，否则淡化时会看到两层错动
      if (s.altModel && s.altModel.visible) {
        s.altModel.y = s.model.y + ((s.altBaseY || 0) - (s.baseY || 0));
        s.altModel.rotation = s.model.rotation;
      }

      // 会演小动作的座位：把额外偏移叠到待机/发言的曲线上，眼睛按自己的节奏眨。
      // 这些量每帧都要给 0 兜底：参数写入是「跳过 undefined」，若留 undefined，
      // 上一个动作的值会停在模型上（歪头就永久歪着）。
      let eye, tilt = 0, eyeX = 0, eyeY = 0, brow = 0, mform = 0, happy = 0, hair = 0;
      // 道具通道（斧头）：0 = 该部件整层透明。只有 axe 动作会给它非零值，
      // 而 axe 只进带 axePart 的座位池，所以别的角色这行永远是 0。
      let axe = 0;
      let winkL, winkR;
      if (s.cfg && s.cfg.gestures) {
        const off = forceGest
          ? (GESTURES.find(x => x.id === forceGest.id) || GESTURES[0]).f(forceGest.u)
          : (noGest ? null : gestureOffsets(s, t));
        if (off) {
          // 「朝发言人偏头」和「自己张望」会互相抵消：lookSmooth 已经把 turn 推到 ±7°，
          // 再叠一个 look/glance（±9..13°）就是 20°，3 头身的脖子会拧成麻花。
          // 正在看发言人时：张望类动作整段跳过，其余动作的 turn 只留 1/4。
          const lookAmt = Math.abs(s.lookSmooth || 0);
          const gid = forceGest ? forceGest.id : (s.g && s.g.g.id);
          const contradictsLook = lookAmt > 0.55 && (gid === 'look' || gid === 'glance');
          if (!contradictsLook) {
            nod += off.nod || 0;
            turn += (off.turn || 0) * (1 - 0.75 * lookAmt);
            lean += off.lean || 0;
            tilt = off.tilt;
            eyeX = off.eyeX;
            eyeY = off.eyeY;
            brow = off.brow;
            happy = off.happy;
            hair = off.hair;
            mform = off.mform;
            winkL = off.winkL;
            winkR = off.winkR;
            axe = off.axe || 0;
          }
        }
      }
      if (s.cfg && s.cfg.blink) eye = pinEye !== null ? pinEye : blinkValue(s, t);
      // wink 与整体眨眼取较小值：正在眨眼时再 wink，会让一只眼停在半开的位置
      let eyeL = eye, eyeR = eye;
      if (winkL !== undefined) eyeL = eyeL === undefined ? winkL : Math.min(eyeL, winkL);
      if (winkR !== undefined) eyeR = eyeR === undefined ? winkR : Math.min(eyeR, winkR);

      // 眼珠跟着头一起朝发言人（幅度最小，太大就成对眼了）
      if (s.lookSmooth) eyeX += s.lookSmooth * 0.55;
      // 待机时眼珠也要自己「活」：两条互质的慢正弦 + 一点竖直漂移，相位按座位错开，
      // 六个座位不会同拍。幅度压在 ±0.25：眼白只比虹膜宽一点点，probe 实测到 0.9
      // 虹膜才贴到眼睑上，座位尺度下 0.25 已经能看出视线在动。
      if (!s.speaking) {
        eyeX += 0.17 * Math.sin(t / 2600 + s.i * 1.3) + 0.06 * Math.sin(t / 900 + s.i * 2.1);
        eyeY += 0.06 * Math.sin(t / 3300 + s.i * 0.7);
      }
      // 所有来源叠加后统一夹一次：动作里的 look/glance 本身就有 ±0.6，再叠发言人偏置
      // 和漂移会溢出到眼睑外侧，露出一整圈「没被虹膜盖住的眼白」。
      eyeX = Math.max(-0.85, Math.min(0.85, eyeX));
      eyeY = Math.max(-0.55, Math.min(0.55, eyeY));
      // 两个不同周期的正弦叠加，避免看出机械的来回摆；相位按座位错开，六个座位不会同拍。
      if (s.cfg && s.cfg.sway) {
        hair += 0.085 * Math.sin(t / 1500 + s.i * 1.7) + 0.035 * Math.sin(t / 620 + s.i * 2.3);
      }
      const pose = { turn, nod, lean, tilt, eyeX, eyeY, brow, mform, happy, hair, mouth: s.mouth, breath, eye,
                     eyeL, eyeR, axe };
      // ?debug=1 的 overlay 会把这一帧写进模型的数值贴出来。像素 diff 在无头截图里
      // 有 ~600px 的噪声地板（场景微尘 + AA），微妙动作只有看数字才判得准。
      s.poseDbg = { turn, nod, lean, tilt, look: s.lookSmooth || 0, hair, eyeX, eyeY, ln: listenAmt,
                    sy: s.speaking ? sy : 0, mouth: s.mouth, eye,
                    bl: s.blinkN || 0, blsy: s.blinkSy || 0,
                    g: (forceGest ? forceGest.id : (s.g && s.g.g.id)) || '-' };
      applyPoseParams(s.model, pose);
      if (s.altModel && s.altModel.visible) {
        applyPoseParams(s.altModel, pose);
        // 物理是每个模型各自算的：两层各跑一套头发/身体物理，几秒后相位就错开，
        // 淡化时看到「两份头发在互相错位」。把主层的全部参数值抄给第二层
        // （部件相同、参数相同 → 除了手臂和书，两层逐像素一致），错位立刻消失。
        try {
          const cm = s.model.internalModel.coreModel;
          const ca = s.altModel.internalModel.coreModel;
          if (!s.paramIds) {
            s.paramIds = cm._parameterIds
              ? cm._parameterIds.slice()
              : Array.from({ length: cm.getParameterCount() }, (_, i) => cm.getParameterId(i));
          }
          for (const id of s.paramIds) {
            try { ca.setParameterValueById(id, cm.getParameterValueById(id)); } catch (e) { /* id 不在第二层 */ }
          }
        } catch (e) { /* coreModel 形状变了就跳过同步，别把整帧弄挂 */ }
      }
    }
  }, null, PIXI.UPDATE_PRIORITY.LOW);

  function showBubble(i, text) {
    const s = seats[i];
    s.bubble.querySelector('.body').textContent = text.length > 46 ? text.slice(0, 46) + '…' : text;
    s.bubble.classList.add('show');
    document.getElementById('status').textContent = `${NAMES[i]} 发言中…`;
  }
  function hideBubble(i) { seats[i].bubble.classList.remove('show'); }
  // 谁在说话：其余座位会朝这个方向偏头/看过去 —— 圆桌上「听人说话」的关键动作，
  // 比各自随机摇摆更像活的。speakerI 用 -1 表示没人说话（回到自由待机）。
  let speakerI = -1;
  function speak(i, ms) {
    const s = seats[i]; s.speaking = true;
    // 开口前先等一个换气口再眨：把随机眨眼的进度清掉，pauseArmed 从头计时
    s.blinkStart = undefined; s.pauseArmed = false;
    speakerI = i;
    showBubble(i, LINES[i % LINES.length]);
    setTimeout(() => {
      s.speaking = false; hideBubble(i);
      if (speakerI === i) speakerI = -1;
      document.getElementById('status').textContent = '等待下一位…';
    }, ms);
  }

  if (isStatic) {
    speak(speakSeat !== null ? speakSeat % count : Math.min(2, count - 1), 60000);
  } else {
    let turn = 1;
    if (speakSeat !== null) speak(speakSeat % count, 600000);
    setInterval(() => { speak(turn % count, 2000); turn++; }, 2600);
    speak(0, 2000);
  }

  // 切姿势：__setPose(座位号, 'alt'|'main', 毫秒)；截图用 ?pose=4:alt（直接跳到终态，不等淡化）
  window.__setPose = (i, which, ms) => {
    const s = seats[i];
    if (!s) return false;
    const on = (which === 'alt' || which === 'book');
    const go = () => { s.poseTarget = on ? 1 : 0; s.poseMs = ms || 240; pinnedPose = 1; };
    if (s.altModel) go();
    else if (s.loadAlt) s.loadAlt().then(go);   // 懒加载：第一次切姿势时再拉模型
    else return false;
    return true;
  };
  const poseQ = q.get('pose');
  if (poseQ) {
    for (const spec of poseQ.split(',')) {
      const [si, which] = spec.split(':');
      const s = seats[parseInt(si, 10)];
      if (!s) continue;
      const on = (which === 'alt' || which === 'book');
      const apply = () => {
        if (!s.altModel) return;
        s.poseT = on ? 1 : 0; s.poseTarget = s.poseT; s.poseMs = 1;
        s.model.alpha = on ? 0 : 1;
        s.altModel.alpha = on ? 1 : 0;
        s.altModel.visible = on;
        s.altModel.autoUpdate = on && !freeze;
      };
      if (s.altModel) apply(); else if (s.loadAlt) s.loadAlt().then(apply);
    }
  }

  requestAnimationFrame(() => requestAnimationFrame(() => {
    const info = seats.map(s => {
      if (!s.model) return { i: s.i, ok: false };
      const b = s.model.getBounds();
      return { i: s.i, ok: true, left: Math.round(b.left), right: Math.round(b.right), top: Math.round(b.top), bottom: Math.round(b.bottom) };
    });
    document.body.dataset.debug = JSON.stringify({ loaded, count, charH, step: Math.round(step), fps: document.getElementById('fps').textContent, xs: xs.map(Math.round), info });
    window.__stageReady = true;
  }));
})().catch(e => {
  document.getElementById('status').textContent = '加载失败: ' + e.message;
  console.error(e);
});
</script>
</body>
</html>
